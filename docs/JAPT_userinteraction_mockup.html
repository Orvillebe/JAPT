// drag and drop: een taak kan op een werkblok of op een lijst (behalve Ingepland), ook als die dicht is
let drag = null;
const dropTarget = e => e.target.closest && (e.target.closest('.dz') || e.target.closest('.cycle') || e.target.closest('.cyblock') || e.target.closest('.block') || e.target.closest('.sec:not([data-list="planned"])'));
document.addEventListener('dragstart', e=>{
  const el = e.target.closest && e.target.closest('[data-task]');
  if(!el) return;
  drag = {task:+el.dataset.task, src:el.dataset.src, srcp:el.dataset.srcp};   // srcp: een taak met meerdere blokken in een werkperiode wordt vanuit de werkperiodeweergave in één keer verplaatst
  e.dataTransfer.effectAllowed = 'move';
  e.dataTransfer.setData('text/plain', String(drag.task));
  setTimeout(()=>{ el.classList.add('dragging'); document.body.classList.add('dragging-any'); },0);
});
// handmatige volgorde: in Nog niet ingepland en Backlog zet je een taak op een plek door ze tussen twee taken te laten vallen
const SORTABLE = ['open','backlog'];
let dropMark = null;   // {id, after}: naast welke taak de gesleepte taak terechtkomt
function clearMarks(){ document.querySelectorAll('.ins-before,.ins-after').forEach(x=>x.classList.remove('ins-before','ins-after')); dropMark = null; }
function moveTask(id, targetId, after){
  const i = S.tasks.findIndex(t=>t.id===id); if(i < 0 || id === targetId) return;
  const [k] = S.tasks.splice(i,1);
  const j = S.tasks.findIndex(t=>t.id===targetId);
  S.tasks.splice(j < 0 ? S.tasks.length : j + (after ? 1 : 0), 0, k);
}
function markFor(e, sec){
  // bepaalt naast welke taak de gesleepte taak valt: op een kaart (boven of onder de helft), op de kop (voor de eerste), eronder (na de laatste)
  const cards = [...sec.querySelectorAll('.task')].filter(c=>+c.dataset.task !== drag.task);
  if(!cards.length) return null;
  const card = e.target.closest('.task');
  if(card && +card.dataset.task !== drag.task){ const r = card.getBoundingClientRect(); return {id:+card.dataset.task, after: e.clientY > r.top + r.height/2, el:card}; }
  if(card) return null;   // boven de taak zelf
  if(e.target.closest('.sh')) return {id:+cards[0].dataset.task, after:false, el:cards[0]};
  return {id:+cards[cards.length-1].dataset.task, after:true, el:cards[cards.length-1]};
}
// volgorde in een werkblok of werkperiode: tussen twee taken loslaten zet de taak op die plek (de bovenste is de belangrijkste)
function markForChips(e, blk){
  const chips = [...blk.querySelectorAll(blk.querySelector('.cydated,.cyown') ? '.cyown .chip' : '.chip')].filter(c=>+c.dataset.task !== drag.task);
  if(!chips.length) return null;
  if(blk.classList.contains('cycle')){   // taken naast elkaar (met regelovergang): de dichtstbijzijnde taak, links of rechts ervan
    let best = null, bd = 1e9;
    for(const c of chips){ const r = c.getBoundingClientRect(), cx = r.left + r.width/2, cy = r.top + r.height/2, d = Math.hypot(e.clientX - cx, (e.clientY - cy) * 2); if(d < bd){ bd = d; best = {c, cx}; } }
    return {id:+best.c.dataset.task, after: e.clientX > best.cx, el:best.c};
  }
  const c = e.target.closest('.cyown .chip, .chip');
  if(c && +c.dataset.task !== drag.task && chips.includes(c)){ const r = c.getBoundingClientRect(); return {id:+c.dataset.task, after: e.clientY > r.top + r.height/2, el:c}; }
  if(c) return null;   // boven de taak zelf
  const first = chips[0].getBoundingClientRect();
  if(e.clientY < first.top) return {id:+chips[0].dataset.task, after:false, el:chips[0]};
  return {id:+chips[chips.length-1].dataset.task, after:true, el:chips[chips.length-1]};
}
function placeInPlan(key, id, mark){
  const list = S.plan[key] = (S.plan[key]||[]).filter(x=>x!==id), j = mark ? list.indexOf(mark.id) : -1;
  if(j < 0) list.push(id); else list.splice(j + (mark.after ? 1 : 0), 0, id);
}
// een taak op een werkblok staat vast tussen de andere taken van dat blok: loslaten op de vaste taken van de eigen werkperiode doet niets
function sameDated(e, tg){
  if(!drag || !tg.classList.contains('cyblock') || !e.target.closest('.cydated') || !drag.src.includes('|')) return false;
  const pr = periodAt(drag.src.split('|')[0]); return !!pr && pr.key === tg.dataset.block;
}
// een dichte lijst klapt open als je er even boven blijft hangen met een taak; erop loslaten zonder te wachten werkt ook
let springKey = null, springTimer = null;
function clearSpring(){ clearTimeout(springTimer); springTimer = null; springKey = null; }
function springOpen(sec){
  const key = sec.dataset.list; S.fold[key] = false; sec.classList.remove('closed');
  const items = itemsOf(key);
  sec.insertAdjacentHTML('beforeend', `<div class="sb">${items.length ? renderItems(items) : `<div class="none-msg">${key==='open' ? 'Alles is ingepland of staat in een andere lijst.' : 'Niets in deze lijst.'}</div>`}</div>`);

  document.body.classList.remove('dragging-any');

document.addEventListener('dragover', e=>{
  if(S.view === 'inbox'){ clearMarks(); clearSpring(); return; }   // in de Inbox hoort enkel de eigen sleeplogica te werken
  const tg = dropTarget(e);
  if(tg && drag && sameDated(e, tg)){ clearMarks(); document.querySelectorAll('.over').forEach(x=>x.classList.remove('over')); return; }
  if(tg && drag){
    e.preventDefault();
    document.querySelectorAll('.over').forEach(x=>{if(x!==tg)x.classList.remove('over')});
    tg.classList.add('over');
    clearMarks();
    if(tg.dataset.list && tg.classList.contains('closed')){
      if(springKey !== tg.dataset.list){
        clearSpring(); springKey = tg.dataset.list;
        springTimer = setTimeout(()=>{ const sec = document.querySelector(`#tasks .sec[data-list="${springKey}"]`); if(sec && drag && sec.classList.contains('closed')) springOpen(sec); springKey = null; }, 500);
      }
    } else clearSpring();
    if(tg.dataset.list && SORTABLE.includes(tg.dataset.list)){
      const m = markFor(e, tg);
      if(m){ dropMark = {id:m.id, after:m.after}; m.el.classList.add(m.after ? 'ins-after' : 'ins-before'); }
    } else if(tg.dataset.block){
      const m = markForChips(e, tg);
      if(m){ dropMark = {id:m.id, after:m.after}; m.el.classList.add(m.after ? 'ins-after' : 'ins-before'); }
    }
  } else { clearMarks(); clearSpring(); }
});
document.addEventListener('drop', e=>{
  const tg = dropTarget(e);
  if(!tg || !drag || S.view === 'inbox') return;
  if(sameDated(e, tg)){ e.preventDefault(); drag = null; clearMarks(); clearSpring(); document.body.classList.remove('dragging-any'); render(); return; }
  e.preventDefault();
  if(tg.dataset.list){
    const list = tg.dataset.list, k0 = taskOf(drag.task), mark = dropMark;
    if(!(k0 && SORTABLE.includes(list) && listOf(k0) === list)) setList(drag.task, list);   // binnen dezelfde lijst verandert enkel de volgorde
    if(SORTABLE.includes(list)){
      if(mark) moveTask(drag.task, mark.id, mark.after);
      else if(k0 && listOf(k0) === list && tg.dataset.list){ const ids = S.tasks.filter(t=>t.id!==drag.task && listOf(t)===list).map(t=>t.id); if(ids.length) moveTask(drag.task, ids[ids.length-1], true); }   // zonder plek: onderaan
    }
  } else {
    // taak in een blok waar ze al staat: ze wordt samengevoegd, geen dubbele
    const id = tg.dataset.block, mark = dropMark;
    if(drag.src === id){ if(mark) placeInPlan(id, drag.task, mark); }   // in hetzelfde blok verandert enkel de volgorde
    else {   // loslaten in het blok waar de taak al staat verandert niets
      // een taak mag in meerdere werkperioden en op meerdere dagen staan; binnen één werkperiode staat ze in de werkperiode zelf of op vaste dagen, nooit allebei: de nieuwe plek wint
      const out = key => { S.plan[key] = (S.plan[key]||[]).filter(x=>x!==drag.task); };
      if(drag.src !== 'new') out(drag.src);
      if(drag.srcp){ const sp = periodIn(drag.srcp.slice(3), S.cycle); if(sp) Object.keys(S.plan).forEach(key=>{ if(key.includes('|') && key.split('|')[0] >= sp.start && key.split('|')[0] <= sp.end) out(key); }); }   // slepen verplaatst; vanuit de lijst komt er een plek bij
      if(id.startsWith('cy@')){ const pr = periodAt(id.slice(3)); if(pr) Object.keys(S.plan).forEach(key=>{ if(key.includes('|') && key.split('|')[0] >= pr.start && key.split('|')[0] <= pr.end) out(key); }); }
      else { const pr = periodAt(id.split('|')[0]); if(pr) out(pr.key); }
      const list = S.plan[id] = S.plan[id] || [];   // pas na het verwijderen ophalen, want het filteren maakt een nieuwe lijst
      if(!list.includes(drag.task)) placeInPlan(id, drag.task, mark);
      const k = taskOf(drag.task); if(k){ k.status = 'open'; S.flash = listOf(k); }
    }
  }
  drag = null; clearMarks(); clearSpring();
  document.body.classList.remove('dragging-any');
  render();
});

function reapplyHover(){
  document.querySelectorAll('.hl,.same').forEach(x=>x.classList.remove('hl','same'));
  const on = focusId !== null;
  document.body.classList.toggle('hov', on);
  if(!on) focusHost = null;

    if(focusHost && x.classList.contains('chip')){ const h = x.closest('[data-block]'); if(h && h.dataset.block !== focusHost){ x.classList.add('same'); return; } }
    x.classList.add('hl');
  });
}

let fxBusy = false;
const fxSleep = ms => new Promise(r=>setTimeout(r, ms));
const fxAnim = (el, kf, o) => el.animate(kf, Object.assign({fill:'forwards', easing:'ease'}, o || {}));
function fxMaybe(chk){
  if(fxBusy || matchMedia('(prefers-reduced-motion:reduce)').matches || Math.random() >= FX_CHANCE) return;
  const row = chk.closest('.task,.chip,.pt,.gvt') || chk.parentElement; if(!row) return;
  const r = row.getBoundingClientRect(), c = chk.getBoundingClientRect(); if(r.width < 60) return;
  const kinds = ['robot','chicken','lamb','vac','cat'];
  fxPlay(kinds[Math.floor(Math.random() * kinds.length)], r, c).catch(()=>{});
}
async function fxPlay(kind, r, c){
  fxBusy = true;
  const W = r.width, layers = [];
  const layer = h => { const d = document.createElement('div'); d.style.cssText = `position:fixed;left:${r.left}px;top:${r.top - 46}px;width:${W}px;height:${h}px;overflow:hidden;pointer-events:none;z-index:9000`; document.body.appendChild(d); layers.push(d); return d; };
  const add = (host, svg, css) => { const e = document.createElement('div'); e.style.cssText = 'position:absolute;' + css; e.innerHTML = svg; const s = e.firstElementChild; s.style.cssText = 'display:block;width:100%;height:100%;overflow:visible'; host.appendChild(e); return e; };
  const behind = layer(46), UP = 'translateY(52px)';
  try{
    if(kind === 'robot'){
      const e = add(behind, FX_SVG.robot, 'left:64%;top:6px;width:40px;height:40px;transform:' + UP);
      await fxAnim(e, [{transform:UP},{transform:'none'}], {duration:450, easing:'cubic-bezier(.2,1.3,.5,1)'}).finished;
      fxAnim(e.querySelector('.arm'), [{transform:'rotate(0)'},{transform:'rotate(-35deg)'}], {duration:350, iterations:4, direction:'alternate'});
      e.querySelector('.arm').style.cssText = 'transform-box:fill-box;transform-origin:50% 100%';
      fxAnim(e.querySelector('.light'), [{opacity:1},{opacity:.15}], {duration:300, iterations:4, direction:'alternate'});
      e.querySelectorAll('.eye').forEach(x=>{ x.style.cssText = 'transform-box:fill-box;transform-origin:center'; fxAnim(x, [{transform:'scaleY(1)'},{transform:'scaleY(.1)'},{transform:'scaleY(1)'}], {duration:240, delay:600}); });
      await fxSleep(1500);
      await fxAnim(e, [{transform:'none'},{transform:UP}], {duration:350, easing:'ease-in'}).finished;
    }
    if(kind === 'chicken'){
      const h = add(behind, FX_SVG.chicken, 'left:52%;top:4px;width:46px;height:42px;transform:' + UP), egg = add(behind, FX_SVG.egg, 'left:calc(52% - 17px);top:28px;width:14px;height:18px;opacity:0');
      await fxAnim(h, [{transform:UP},{transform:'none'}], {duration:420, easing:'cubic-bezier(.2,1.3,.5,1)'}).finished;
      fxAnim(h, [{transform:'rotate(0)'},{transform:'rotate(-6deg)'},{transform:'rotate(6deg)'},{transform:'rotate(-5deg)'},{transform:'rotate(0)'}], {duration:700});
      await fxSleep(650);
      fxAnim(egg, [{opacity:0, transform:'translateY(-8px) scale(.4)'},{opacity:1, transform:'translateY(0) scale(1.15)'},{opacity:1, transform:'translateY(0) scale(1)'}], {duration:450});
      await fxSleep(1100);
      fxAnim(egg, [{opacity:1},{opacity:0}], {duration:500, delay:200});
      await fxAnim(h, [{transform:'none'},{transform:UP}], {duration:350, easing:'ease-in'}).finished;
      await fxSleep(300);
    }
    if(kind === 'lamb'){
      const l = add(behind, FX_SVG.lamb, 'left:0;top:12px;width:46px;height:34px;opacity:0');
      fxAnim(l, [{opacity:1, transform:'translate(-56px,0)'},{opacity:1, transform:`translate(${W + 10}px,0)`}], {duration:2200, easing:'linear'});
      const hop = []; for(let i = 0; i <= 10; i++) hop.push({transform:i % 2 ? 'translateY(-14px)' : 'translateY(0)', offset:i / 10});
      fxAnim(l.firstElementChild, hop, {duration:2200, easing:'ease-out'});
      await fxSleep(2250);
    }
    if(kind === 'vac'){
      const v = add(behind, FX_SVG.vac, 'left:0;top:24px;width:38px;height:22px;opacity:0');
      await fxAnim(v, [{opacity:1, transform:'translateX(-44px)'},{opacity:1, transform:`translateX(${W + 10}px)`}], {duration:2100, easing:'linear'}).finished;
    }
    if(kind === 'cat'){
      const cx = Math.max(0, Math.min(W - 34, c.left - r.left + c.width / 2 - 17));   // boven het vakje dat je afvinkt
      const head = add(behind, FX_SVG.cat, `left:${cx}px;top:16px;width:34px;height:30px;transform:${UP}`);
      await fxAnim(head, [{transform:UP},{transform:'none'}], {duration:420, easing:'cubic-bezier(.2,1.3,.5,1)'}).finished;
      await fxAnim(head, [{transform:'rotate(0)'},{transform:'rotate(-7deg)'},{transform:'rotate(7deg)'},{transform:'rotate(-5deg)'},{transform:'rotate(0)'}], {duration:900}).finished;
      await fxSleep(250);
      await fxAnim(head, [{transform:'none'},{transform:UP}], {duration:350, easing:'ease-in'}).finished;
    }
  } finally { layers.forEach(d=>d.remove()); fxBusy = false; }
}

// gsm (aanraking): Dag, Werkweek en Week volgen je vinger. Veeg naar links voor de volgende dag of week, naar rechts voor de vorige (de pijltjes blijven werken).
// Loslaten voorbij een kwart van het scherm (of een snelle veeg) wisselt, anders veert het terug. De werkperiode-balk bovenaan scrolt zelf opzij en doet hier niet aan mee.
(function(){
  const wv = document.getElementById('weekView'), ids = ['head','body'];
  const coarse = () => matchMedia('(pointer:coarse)').matches;
  const els = () => ids.map(id=>document.getElementById(id));
  const setX = (x, anim, op) => els().forEach(e=>{ e.style.transition = anim ? 'transform .17s ease-out, opacity .17s ease-out' : 'none'; e.style.transform = x ? `translateX(${x}px)` : ''; e.style.opacity = op == null ? '' : op; });
  let g = null;
  wv.addEventListener('touchstart', e=>{
    g = (e.touches.length === 1 && coarse() && ['day','workweek','week'].includes(S.cal.mode) && !e.target.closest('#cycleLane, input, select, textarea, .calbar, .gp, dialog, .pop'))
      ? {x:e.touches[0].clientX, y:e.touches[0].clientY, at:Date.now(), lock:null, dx:0} : null;
  }, {passive:true});
  wv.addEventListener('touchmove', e=>{
    if(!g) return; const t = e.touches[0], dx = t.clientX - g.x, dy = t.clientY - g.y;
    if(!g.lock && (Math.abs(dx) > 10 || Math.abs(dy) > 10)) g.lock = Math.abs(dx) > 1.3 * Math.abs(dy) ? 'h' : 'v';
    if(g.lock === 'h'){ g.dx = dx; setX(dx * 0.9, false, Math.max(.35, 1 - Math.abs(dx) / (wv.clientWidth * 1.4))); }
  }, {passive:true});
  wv.addEventListener('touchend', ()=>{
    if(!g || g.lock !== 'h'){ g = null; return; }
    const dx = g.dx, w = wv.clientWidth, fast = Math.abs(dx) / Math.max(1, Date.now() - g.at) > 0.5; g = null;
    const btn = document.getElementById(dx < 0 ? 'calNext' : 'calPrev');
    if(btn.disabled || !(Math.abs(dx) > w * 0.25 || (fast && Math.abs(dx) > 40))){ setX(0, true); return; }
    const dir = dx < 0 ? -1 : 1;
    setX(dir * w * 0.7, true, 0);
    setTimeout(()=>{ btn.click(); setX(-dir * w * 0.25, false, 0); void wv.offsetWidth; setX(0, true, 1); }, 160);
  }, {passive:true});
  wv.addEventListener('touchcancel', ()=>{ if(g && g.lock === 'h') setX(0, true); g = null; }, {passive:true});
})();

/* WEEK EN WERKWEEK LIGGEND OP DE GSM
   Een webpagina in een browsertab mag het scherm alleen vergrendelen in volledig scherm. Daarom vragen we hier volledig scherm aan en
   vergrendelen we daarna op landscape. Nadeel: Chrome toont dan kort zijn eigen melding "veeg om volledig scherm te verlaten"; die kan
   de pagina niet verbergen. Lukt het niet (andere browser, geen toestemming), dan blijft de gele balk "Draai je gsm voor deze weergave" staan.
   TODO PWA: zodra dit een geïnstalleerde web-app is, hoort dit weg te vallen. Dan stel je de richting in via het webapp-manifest
   ("orientation": "any" of "landscape") en verwijder je lockLandscape en de aanroep hierboven. Dan is ook de melding weg. */
const AUTO_LANDSCAPE = false;   // uit: volledig scherm geeft Chrome's eigen zwarte melding "veeg om volledig scherm te verlaten". Zet op true om het zelf draaien terug te krijgen.
async function lockLandscape(on){
  if(!(matchMedia('(pointer:coarse)').matches && Math.min(screen.width, screen.height) <= 500)) return;   // enkel een gsm: nooit een laptop of tablet
  try{
    if(on){
      if(!document.fullscreenElement && document.documentElement.requestFullscreen) await document.documentElement.requestFullscreen();
      await screen.orientation.lock('landscape');
    } else {
      if(screen.orientation && screen.orientation.unlock) screen.orientation.unlock();
      if(document.fullscreenElement) await document.exitFullscreen();
    }
  }catch(err){ /* niet ondersteund: de gele balk blijft staan */ }
}

function needField(id, msg, focus = true){
  const el = document.getElementById(id); if(!el) return;

  box.classList.add('bad');
  let m = box.querySelector(':scope > .ferr'); if(!m){ m = document.createElement('div'); m.className = 'ferr'; m.setAttribute('role','alert'); box.appendChild(m); }
  m.textContent = msg;
  const clr = () => { box.classList.remove('bad'); m.remove(); };
  (el.tagName === 'SELECT' ? ['change','click'] : ['input']).forEach(ev=>box.addEventListener(ev, clr, {once:true}));
  if(focus){ const t = el.tagName === 'SELECT' ? (box.querySelector('.gpb') || el) : el; t.focus(); }

  const n = S.tasks.filter(k=>k.goal===editGoalId).length;
  goalDelPanel.innerHTML = `<div class="gstat"><b>Dit doel heeft ${n} ${n===1?'taak':'taken'}.</b> Wat doen we ermee?</div>

  goalDelPanel.classList.remove('hidden'); goalBtns.classList.add('hidden');

function deleteGoal(taskHow){
  const id = editGoalId;
  if(taskHow === 'del'){
    const ids = S.tasks.filter(k=>k.goal===id).map(k=>k.id);
    S.tasks = S.tasks.filter(k=>k.goal!==id);
    Object.keys(S.plan).forEach(key=>{ S.plan[key] = S.plan[key].filter(t=>!ids.includes(t)); if(!S.plan[key].length) delete S.plan[key]; });
  } else S.tasks.filter(k=>k.goal===id).forEach(toInbox);   // taken terug naar de Inbox, om aan een ander doel te hangen
  S.inbox.forEach(k=>{ if(k.goal===id) k.goal = null; });
  const gone = S.goals.find(g=>g.id===id);
  S.goals = S.goals.filter(g=>g.id!==id);
  S.filter.goal = S.filter.goal.filter(v=>v !== String(id));
  if(gone && gone.client !== null && !S.goals.some(g=>g.client===gone.client)){   // laatste doel van de klant: klant mee weg
    S.clients = S.clients.filter(c=>c.id!==gone.client);
    S.filter.client = S.filter.client.filter(v=>v !== String(gone.client));
  }
  editGoalId = null; resetGoalDel(); stashGoalForm(); if(goalView.open) goalView.close(); if(goalDlg.open) goalDlg.close(); render();
}
document.getElementById('goalDelete').addEventListener('click', ()=>{
  const del = document.getElementById('goalDelete');
  if(S.tasks.some(k=>k.goal===editGoalId)){ renderGoalDel(); return; }   // eerst kiezen wat er met de taken gebeurt
  if(!goalDelArmed){ goalDelArmed = true; del.classList.add('confirm'); del.textContent = 'Zeker? Definitief verwijderen'; return; }
  deleteGoal('free');
});
goalDelPanel.addEventListener('click', e=>{
  const pk = e.target.closest('[data-gdelpick]');
  if(pk){ goalDelHow = pk.dataset.gdelpick; renderGoalDel(); return; }
  if(e.target.closest('[data-gdelcancel]')){ resetGoalDel(); return; }
  if(e.target.closest('[data-gdelgo]') && goalDelHow) deleteGoal(goalDelHow);
});
document.getElementById('goalForm').addEventListener('submit', e=>{
  e.preventDefault();

  const desc = document.getElementById('newGoalDesc').value.trim();
  const cn = clientInput.value.trim();
  let client = null;
  if(cn){
    let c = clientNamed(cn);
    if(!c){ c = {id:S.nextClient++, name:cn}; S.clients.push(c); }

  }

  goalDlg.close(); render();
});

const hhmm = h => { const m = Math.round(h*60); return String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0'); };
const unhhmm = v => { const [h,m] = v.split(':').map(Number); return h + m/60; };
const timeOpts = cur => { const hs = []; for(let h=5; h<=23.75; h+=.25) hs.push(h); if(!hs.includes(cur)) hs.push(cur); hs.sort((x,y)=>x-y); return hs.map(h=>`<option value="${hhmm(h)}" ${h===cur?'selected':''}>${hhmm(h)}</option>`).join(''); };
const MDAYS_BASE = ['ma','di','wo','do','vr','za','zo'];
const mdays = () => { const i = MDAYS_BASE.indexOf(WDN[S.weekStart]); return MDAYS_BASE.slice(i).concat(MDAYS_BASE.slice(0,i)); };   // volgorde volgt de weekstart
const curBlocks = () => BLOCKS.filter(b=>!b.to);   // de blokken die nu gelden (oudere versies blijven bestaan voor het verleden)
const plannedIn = id => Object.keys(S.plan).filter(k=>{ const [d,i] = k.split('|'); return i===id && d >= TODAY; }).reduce((n,k)=>n+(S.plan[k]||[]).length, 0);   // enkel vanaf vandaag
function reviseBlock(b, ch){
  if(b.from && b.from >= TODAY){ Object.assign(b, ch); return b; }   // pas vandaag gemaakt: geen verleden om te bewaren
  const nb = {...b, ...ch, id:'b'+(S.nextBlock++), from:TODAY, to:null};
  b.to = addDays(TODAY,-1);                                           // het oude blok blijft gelden tot gisteren
  Object.keys(S.plan).forEach(k=>{ const [d,i] = k.split('|'); if(i===b.id && d >= TODAY){ S.plan[d+'|'+nb.id] = S.plan[k]; delete S.plan[k]; } });   // geplande taken verhuizen mee
  BLOCKS.push(nb); if(S.selBlock === b.id) S.selBlock = nb.id;
  return nb;
}
function removeBlock(b){
  Object.keys(S.plan).forEach(k=>{ const [d,i] = k.split('|'); if(i===b.id && d >= TODAY) delete S.plan[k]; });   // enkel vanaf vandaag uit de agenda
  if(b.from && b.from >= TODAY) BLOCKS.splice(BLOCKS.indexOf(b),1); else b.to = addDays(TODAY,-1);
}
function blockProblem(day, id, s0, e0){
  if(!(e0 > s0)) return 'Het einde van een blok moet na het begin liggen.';
  if(curBlocks().some(o=>o.day===day && o.id!==id && s0 < o.e && o.s < e0)) return 'Dit blok overlapt met een ander blok op dezelfde dag.';
  return '';
}
// werkblokken in het raster: slepen om te maken, te verplaatsen of de duur aan te passen (kwartieren)
const SNAP = .25, MINLEN = .25, snapH = h => Math.round(h/SNAP)*SNAP;
function fitBlock(day, id, mode, ref, cur){
  // geeft {s,e} binnen de ruimte tussen de buurblokken, of null als er geen plek is
  const ns = curBlocks().filter(o=>o.day===day && o.id!==id);
  if(mode === 'move'){
    const len = ref.e - ref.s, s0 = Math.max(0, Math.min(cur, 24-len)), e0 = s0 + len;
    return ns.some(o=>s0 < o.e && o.s < e0) ? null : {s:s0, e:e0};
  }
  const lowLimit = a => Math.max(0, ...ns.filter(o=>o.e <= a).map(o=>o.e));
  const upLimit = a => Math.min(24, ...ns.filter(o=>o.s >= a).map(o=>o.s));
  if(mode === 'top'){ const lo = lowLimit(ref.s), s0 = Math.max(lo, Math.min(cur, ref.e - MINLEN)); return {s:s0, e:ref.e}; }
  if(mode === 'bottom'){ const up = upLimit(ref.e), e0 = Math.min(up, Math.max(cur, ref.s + MINLEN)); return {s:ref.s, e:e0}; }
  // nieuw blok: ref.s is het startpunt, cur het huidige punt
  const a = ref.s, lo = lowLimit(a), up = upLimit(a);
  let s0 = Math.max(lo, Math.min(a, cur)), e0 = Math.min(up, Math.max(a, cur));
  if(e0 - s0 < MINLEN) e0 = s0 + MINLEN;
  return e0 <= up + 1e-9 && s0 >= lo - 1e-9 ? {s:s0, e:e0} : null;
}
function findGap(day){
  const ns = curBlocks().filter(o=>o.day===day);
  for(const size of [3,2,1,.5,.25]) for(let a=8; a+size<=24; a+=.25) if(!ns.some(o=>a < o.e && o.s < a+size)) return {s:a, e:a+size};
  return null;
}

document.getElementById('manageBody').addEventListener('pointerdown', e=>{
  const col = e.target.closest('.wkcol'); if(!col || e.button > 0) return;
  const grid = col.closest('.wk'), lo = +grid.dataset.lo, PXH = +grid.dataset.px, day = col.dataset.day;
  const rect = col.getBoundingClientRect(), hourAt = y => lo + (y - rect.top)/PXH;
  const blk = e.target.closest('.wkb'), id = blk ? blk.dataset.bsel : null, b = id ? BLOCKS.find(x=>x.id===id) : null;
  let mode = 'create', ref = {s:snapH(hourAt(e.clientY)), e:snapH(hourAt(e.clientY))};
  if(b){ mode = e.target.closest('.hnd.t') ? 'top' : e.target.closest('.hnd.b') ? 'bottom' : 'move'; ref = {s:b.s, e:b.e}; }
  blockDrag = {mode, id, day, col, blk, lo, PXH, hourAt, startY:e.clientY, ref, grid:hourAt(e.clientY), moved:false, cand:null, ghost:null};
  e.preventDefault();
  document.addEventListener('pointermove', onBlockMove);
  document.addEventListener('pointerup', onBlockUp, {once:true});
  document.addEventListener('pointercancel', onBlockUp, {once:true});
});
function onBlockMove(e){
  const d = blockDrag; if(!d) return;
  if(!d.moved && Math.abs(e.clientY - d.startY) < 4) return;
  d.moved = true;
  const h = snapH(d.hourAt(e.clientY));
  let cand;
  if(d.mode === 'move') cand = fitBlock(d.day, d.id, 'move', d.ref, snapH(d.ref.s + (e.clientY - d.startY)/d.PXH));
  else cand = fitBlock(d.day, d.id, d.mode, d.ref, h);
  if(!cand) return;
  d.cand = cand;
  let el = d.blk;
  if(!el){ if(!d.ghost){ d.ghost = document.createElement('div'); d.ghost.className = 'wkb ghost'; d.col.appendChild(d.ghost); } el = d.ghost; }
  el.style.top = (cand.s - d.lo)*d.PXH + 'px'; el.style.height = (cand.e - cand.s)*d.PXH - 2 + 'px';
  el.innerHTML = `<b>${fmt(cand.s)} tot ${fmt(cand.e)}</b>`;
}
function onBlockUp(){
  document.removeEventListener('pointermove', onBlockMove); document.removeEventListener('pointerup', onBlockUp); document.removeEventListener('pointercancel', onBlockUp);
  const d = blockDrag; blockDrag = null; if(!d) return;
  S.confirmDel = null; S.manageErr = ''; S.copyTo = [];
  if(d.mode === 'create'){
    let cand = d.cand;
    if(!d.moved){ const up = fitBlock(d.day, null, 'create', {s:d.ref.s, e:d.ref.s}, d.ref.s + 1); cand = up; }   // een klik maakt een blok van een uur
    if(!cand){ S.manageErr = 'Hier is geen plek voor een blok.'; renderManage(); return; }
    const nb = {id:'b'+(S.nextBlock++), day:d.day, s:cand.s, e:cand.e, label:'', from:TODAY, to:null}; BLOCKS.push(nb); S.selBlock = nb.id;
  } else {
    const b = BLOCKS.find(x=>x.id===d.id);
    S.selBlock = d.id;
    if(b && d.moved && d.cand) reviseBlock(b, {s:d.cand.s, e:d.cand.e});
  }
  render(); renderManage();
}

function cycleApplyForm(){   // lengte en datum samen toepassen; geeft terug of het gelukt is
  const c = S.cycle, last = cycleLast(), futureLast = last.from > TODAY, solo = c.segs.length === 1 && futureLast;
  const n = Math.max(1, Math.min(60, Math.round(+document.getElementById('mCyN').value) || 1)), u = document.getElementById('mCyU').value;
  const nw = u === 'm' ? {len:n, unit:'m'} : {len:n*u}, d = document.getElementById('mCyStart').value;
  const fail = msg => { S.manageErr = msg; const el = manageBody.querySelector('.merr'); el.textContent = msg; el.classList.remove('hidden'); return false; };   // zonder opnieuw te tekenen, zodat wat je invulde blijft staan
  if(!d) return fail('Kies een datum.');
  if(!solo && d <= TODAY) return fail('Kies een datum vanaf morgen. Wat voorbij is blijft zoals het was.');
  if(futureLast && c.segs.length > 1 && d <= c.segs[c.segs.length-2].from) return fail('Die datum ligt voor het begin van de vorige werkperiode.');
  const lenChanged = nw.len !== last.len || nw.unit !== last.unit, dateChanged = d !== (solo ? last.from : cycleNextStart());
  if(futureLast){ last.from = d; last.len = nw.len; if(nw.unit) last.unit = nw.unit; else delete last.unit; }
  else if(lenChanged || dateChanged) c.segs.push({from:d, ...nw});

    const wasOn = cycleOn(), back = wasOn ? S.tasks.filter(k=>!k.done && !blocksOfTask(k.id).length && cycleOfTask(k.id)).length : 0;   // enkel in werkperiodes: die gaan terug naar de lijst

const REP_ICON = '<svg class="repi" width="14" height="14" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14.5 9a5.5 5.5 0 1 1-1.6-3.9"/><path d="M14.5 2.8v2.7h-2.7"/></svg>';
const repParse = r => { if(!r) return null; const [n,u] = r.split(':'); return {n:+n, u}; };
const repText = r => { const p = repParse(r); if(!p) return ''; const w = {d:['dag','dagen'], w:['week','weken'], m:['maand','maanden']}[p.u]; return p.n === 1 ? `elke ${w[0]}` : `elke ${p.n} ${w[1]}`; };
const daysIn = (y,m) => new Date(Date.UTC(y,m+1,0)).getUTCDate();
function repNext(ds, r){   // de eerstvolgende datum na de vorige deadline die nog in de toekomst ligt (een veel te late taak levert dus geen achterstallige herhaling op)
  const p = repParse(r); if(!p || !ds) return null;
  const base = parseD(ds);
  for(let i=1; i<2000; i++){
    let c;
    if(p.u === 'm'){ const t = base.getUTCMonth() + i*p.n, y = base.getUTCFullYear() + Math.floor(t/12), m = ((t%12)+12)%12; c = toDs(new Date(Date.UTC(y, m, Math.min(base.getUTCDate(), daysIn(y,m))))); }
    else c = addDays(ds, i*p.n*(p.u === 'w' ? 7 : 1));
    if(c > TODAY) return c;
  }
  return null;
}
function repSpawn(k){   // afvinken van een herhalende taak: de volgende staat in de backlog met de volgende deadline (de deadline-herinnering haalt ze op tijd boven)
  const d = repNext(k.deadline, k.repeat); if(!d) return;
  const n = {id:S.nextId++, title:k.title, desc:k.desc, goal:k.goal, who:k.who.slice(), status:'backlog', done:false, deadline:d, repeat:k.repeat};
  S.tasks.push(n); k.spawned = n.id;
  toast('Volgende herhaling staat in de backlog');
}
function repUnspawn(k){   // het vinkje weer weg: de aangemaakte volgende taak gaat mee weg, tenzij je er al aan gewerkt hebt
  const n = k.spawned && taskOf(k.spawned); delete k.spawned;

  const {st} = dk, t = e.target.closest('button'); if(!t) return;
  if(t.dataset.dkd){ st.sel = t.dataset.dkd; dkDraw(); return; }
  if(t.dataset.dkr !== undefined){
    if(t.dataset.dkr === 'custom'){ st.custom = true; if(!st.rep) st.rep = '2:w'; }
    else { st.custom = false; st.rep = t.dataset.dkr; }
    dkDraw(); return;
  }
  const a = t.dataset.dk;
  if(a === 'prev' || a === 'next'){ st.m += a === 'next' ? 1 : -1; if(st.m < 0){ st.m = 11; st.y--; } if(st.m > 11){ st.m = 0; st.y++; } dkDraw(); }
  else if(a === 'clear'){ st.sel = ''; st.rep = ''; dkCommit(); }
  else if(a === 'ok') dkCommit();
}
function dkChange(e){
  const {st} = dk;
  if(e.target.id === 'dkM'){ st.m = +e.target.value; dkDraw(); }
  else if(e.target.id === 'dkY'){ st.y = +e.target.value; dkDraw(); }
  else if(e.target.id === 'dkU') dkInput(e);
}
function dkInput(){
  const {st} = dk, n = document.getElementById('dkN'), u = document.getElementById('dkU'); if(!n || !u) return;
  st.rep = `${Math.max(1, Math.min(99, Math.round(+n.value) || 1))}:${u.value}`;
}
document.addEventListener('keydown', e=>{ if(e.key === 'Escape' && dk){ dkClose(); e.preventDefault(); e.stopPropagation(); } }, true);
// doelkiezer (Inbox en taakvenster): groepen zoals op de Doelen (klanten op naam, dan Intern), enkel de doelen die in de onderliggende keuzelijst staan
function gpDot(g){ const h = hue(g.id); return `<i class="gpd" style="background:${h === GREY_HUE ? '#9a968c' : `hsl(${h} 55% 45%)`}"></i>`; }
function gpBuild(selId){
  const sel = document.getElementById(selId); if(!sel) return;
  let w = sel.nextElementSibling;
  if(!w || !w.classList.contains('gp')){ w = document.createElement('div'); w.className = 'gp'; w.dataset.for = selId; sel.classList.add('gpsel'); sel.after(w); }
  const first = sel.options[0], blank = first && first.value === '';
  const ids = [...sel.options].map(o=>o.value).filter(v=>v !== '');
  const goals = ids.map(v=>S.goals.find(g=>String(g.id) === v)).filter(Boolean);
  const cur = goals.find(g=>String(g.id) === sel.value);
  const row = g => `<button type="button" class="gpo ${cur && cur.id === g.id ? 'on' : ''}" data-gpv="${g.id}">${gpDot(g)}<span class="gpt">${esc(g.name)}${g.achieved ? ' (behaald)' : ''}</span><i class="gpr"></i></button>`;
  const groups = [...S.clients.slice().sort((x,y)=>x.name.localeCompare(y.name,'nl')).map(c=>({name:c.name, goals:goals.filter(g=>g.client === c.id)})), {name:'Intern', goals:goals.filter(g=>g.client == null)}].filter(x=>x.goals.length);
  const none = blank && !first.disabled ? `<button type="button" class="gpo none ${!cur ? 'on' : ''}" data-gpv=""><span class="gpt">${esc(first.textContent)}</span><i class="gpr"></i></button>` : '';
  w.innerHTML = `<div class="gpbk" data-gpclose></div><button type="button" class="gpb" aria-haspopup="listbox" aria-expanded="false">${cur ? gpDot(cur) : ''}<span class="gpn ${cur ? '' : 'ph'}">${cur ? esc(cur.name) : esc(first ? first.textContent : '')}</span></button>
    <div class="gpp" role="listbox">${none}${groups.map(x=>`<div class="gph">${esc(x.name)}</div>${x.goals.map(row).join('')}`).join('')}</div>`;
}
function gpClose(){ document.querySelectorAll('.gp.open').forEach(w=>{ w.classList.remove('open'); w.querySelector('.gpb').setAttribute('aria-expanded','false'); }); }
document.addEventListener('click', e=>{
  const w = e.target.closest && e.target.closest('.gp');
  if(!w){ gpClose(); return; }
  if(e.target.closest('[data-gpclose]')){ gpClose(); return; }
  const o = e.target.closest('[data-gpv]');
  if(o){ const sel = document.getElementById(w.dataset.for); sel.value = o.dataset.gpv; sel.dispatchEvent(new Event('change', {bubbles:true})); gpClose(); gpBuild(w.dataset.for); return; }
  if(e.target.closest('.gpb')){ e.preventDefault(); const was = w.classList.contains('open'); gpClose(); if(!was){ w.classList.add('open'); w.querySelector('.gpb').setAttribute('aria-expanded','true'); if(!matchMedia('(max-width:700px),(max-height:500px)').matches) w.querySelector('.gpp').scrollIntoView({block:'nearest'}); } }
});
document.addEventListener('keydown', e=>{ if(e.key === 'Escape' && document.querySelector('.gp.open')){ gpClose(); e.preventDefault(); e.stopPropagation(); } }, true);
function fillIbGoal(){
  const sel = document.getElementById('ibGoal'), cur = sel.value;
  sel.innerHTML = '<option value="">Nog geen doel</option>' + S.goals.filter(g=>!g.achieved).map(g=>{
    const c = S.clients.find(c=>c.id===g.client);
    return `<option value="${g.id}">${esc(g.name)}${c?' ('+esc(c.name)+')':''}</option>`;
  }).join('');
  sel.value = S.goals.some(g=>String(g.id)===cur && !g.achieved) ? cur : '';
  gpBuild('ibGoal');
}
// snel toevoegen: enkel de titel is nodig, de rest mag in dezelfde beweging mee
function ibAdd(){
  const inp = document.getElementById('ibIn'), title = inp.value.trim(); if(!title){ needField('ibIn', 'Vul een taak in.'); return; }
  const gv = document.getElementById('ibGoal').value;
  const k = {id:S.nextId++, title, desc:document.getElementById('ibDesc').value.trim(), goal:gv ? +gv : null, who:ibWho.slice(), status:'open', done:false, deadline:document.getElementById('ibDeadline').value || null, repeat:(document.getElementById('ibDeadline').value && document.getElementById('ibDeadline').dataset.rep) || null};
  S.inbox.push(k); S.ibRecent.push(k.id);
  inp.value = ''; document.getElementById('ibDesc').value = ''; document.getElementById('ibGoal').value = ''; gpBuild('ibGoal'); document.getElementById('ibDeadline').value = ''; document.getElementById('ibDeadline').dataset.rep = ''; dxSync('ibDeadline'); ibWho = [];
  renderInbox(); renderIbBadge(); inp.focus();
}
function ibFinish(id, to, extra){
  const i = S.inbox.findIndex(k=>k.id===id); if(i<0) return;
  if((to === 'open' || to === 'backlog') && S.inbox[i].goal == null) return;   // wie ingepland of in de backlog gaat heeft een doel; afvinken kan altijd
  const [k] = S.inbox.splice(i,1);
  const rec = {id, title:k.title, to, item:k, keep:extra && extra.keep, prevGoal:extra && extra.prevGoal, hasPrev:!!(extra && 'prevGoal' in extra), sub:(extra && extra.sub) || ''};
  if(IBMOVED.includes(to)){
    k.status = to === 'backlog' ? 'backlog' : 'open'; k.done = to === 'done'; S.tasks.push(k);
    const g = S.goals.find(x=>x.id===k.goal); if(g) rec.sub = g.name;
  }
  S.ibLog.push(rec); deadlineSweep(); renderInbox(); renderIbBadge(); renderSidebar(); renderWeek();
}
function ibUndo(id){
  const i = S.ibLog.findIndex(r=>r.id===id); if(i<0) return;
  const [r] = S.ibLog.splice(i,1);
  if(IBMOVED.includes(r.to)){ S.tasks = S.tasks.filter(t=>t.id!==id); removeFromAllBlocks(id); }
  if(r.keep){ const kp = taskOf(r.keep.id); if(kp){ kp.goal = r.keep.goal; kp.who = r.keep.who.slice(); } }
  if(r.hasPrev) r.item.goal = r.prevGoal;
  r.item.done = false; S.inbox.unshift(r.item);
  renderInbox(); renderIbBadge(); renderSidebar(); renderWeek();
}
// een taak uit de inbox op een doel (toewijzen) of op een lijst (verwerken) zetten, door slepen of door selecteren en klikken
function ibApply(id, target){
  const it = S.inbox.find(k=>k.id===id); if(!it) return;
  const [kind, list, gid] = target.split(':');
  if(kind !== 'bucket') return;
  const prevGoal = it.goal;
  it.goal = gid === 'none' ? null : +gid;   // het doel waar de bucket bij hoort, en meteen de lijst
  ibFinish(id, list, {prevGoal});
}
document.getElementById('ibForm').addEventListener('submit', e=>{ e.preventDefault(); ibAdd(); });
function ibUndoLast(){ const last = S.ibLog[S.ibLog.length-1]; if(last) ibUndo(last.id); }
document.getElementById('ibUndoBtn').addEventListener('click', ibUndoLast);
document.addEventListener('keydown', e=>{
  if(S.view !== 'inbox' || S.ibTab !== 'sort') return;
  if(!(e.ctrlKey || e.metaKey) || e.shiftKey || e.key.toLowerCase() !== 'z') return;
  if(e.target.closest && e.target.closest('input,textarea,select,dialog')) return;
  e.preventDefault(); ibUndoLast();
});
document.getElementById('ibTabs').addEventListener('click', e=>{ const b = e.target.closest('[data-ibtab]'); if(!b) return; S.ibTab = b.dataset.ibtab; renderInbox(); if(S.ibTab==='add') document.getElementById('ibIn').focus(); });
document.getElementById('ibRecent').addEventListener('click', e=>{ const b = e.target.closest('[data-ibdel]'); if(!b) return; const id = +b.dataset.ibdel; S.inbox = S.inbox.filter(k=>k.id!==id); S.ibRecent = S.ibRecent.filter(x=>x!==id); renderInbox(); renderIbBadge(); });
const ibView = document.getElementById('inboxView');
ibView.addEventListener('click', e=>{
  const b = e.target.closest('button');
  if(b){
    if(b.dataset.ibundo){ ibUndo(+b.dataset.ibundo); return; }
    if(b.dataset.ibtrash){ ibFinish(+b.dataset.ibtrash, 'deleted'); return; }
    return;
  }
  if(e.target.closest('input,.pen,[data-edit],[data-check]')) return;
  const card = e.target.closest('#ibBoard .ibitem .task');
  if(card) openEdit(+card.dataset.task);   // klikken op een taak opent het bewerkvenster
});
// slepen: de gedeelde sleeplogica (drag) houdt bij welke taak gesleept wordt; de doelen en lijsten van het bord zijn hier de dropdoelen
const ibTarget = e => e.target.closest && e.target.closest('#inboxView [data-ibdrop]');
document.addEventListener('dragover', e=>{
  const t = ibTarget(e); if(!t || !drag || !S.inbox.some(k=>k.id===drag.task)) return;
  e.preventDefault();
  document.querySelectorAll('#inboxView .over').forEach(x=>{ if(x!==t) x.classList.remove('over'); });
  t.classList.add('over');
});
document.addEventListener('drop', e=>{
  const t = ibTarget(e); if(!t || !drag || !S.inbox.some(k=>k.id===drag.task)) return;
  e.preventDefault(); const id = drag.task; t.classList.remove('over');
  // de gesleepte kaart verdwijnt uit het bord, dus dragend komt er niet meer: de sleepstand hier zelf opruimen
  dragReset();
  ibApply(id, t.dataset.ibdrop);
});
document.getElementById('inboxView').addEventListener('dragleave', e=>{ const t = ibTarget(e); if(t && !t.contains(e.relatedTarget)) t.classList.remove('over'); });
// op een gsm (smal scherm) opent de Inbox, en Taken toont de Lijst; op een laptop blijft de kalender de standaard
if(matchMedia('(max-width:700px)').matches){ S.view = 'inbox'; S.cal.mode = 'list'; }
if(location.hash === '#inbox') S.view = 'inbox';   // een bladwijzer voor onderweg
document.getElementById('btnHideSide').addEventListener('click', ()=>{ S.sbHidden = true; applyView(); });
document.getElementById('btnShowSide').addEventListener('click', ()=>{ S.sbHidden = false; applyView(); });
applyView();
S.plan['cy@2026-11-02'] = S.tasks.filter(k=>!k.done && k.status==='open' && !blocksOfTask(k.id).length).slice(0,2).map(k=>k.id);   // voorbeeld: twee taken in de werkperiode
render();
</script>
