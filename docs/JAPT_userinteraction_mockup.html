<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Weekplanner prototype</title>
<style>
  :root{
    --bg:#f6f5f2; --panel:#ffffff; --line:#e3e0d8; --text:#232323; --muted:#6b675d;
    --meeting:#d9dde3; --meeting-text:#2f3744; --block:#eef6ee; --block-line:#9cc79c;
    --hover:#d8ecd8; --accent:#2f6b3a;
  }
  *{box-sizing:border-box}
  [hidden]{display:none !important}
  .hidden{display:none !important}
  body{margin:0;font:15px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--text)}
  header{display:flex;align-items:center;gap:16px;padding:14px 20px;border-bottom:1px solid var(--line);background:var(--panel)}
  header h1{font-size:17px;margin:0}
  header .sub{color:var(--muted)}
  header .hr{margin-left:auto;display:flex;gap:8px}
  button{font:inherit;font-size:14px;border:1px solid var(--line);background:#fff;border-radius:6px;padding:5px 10px;cursor:pointer}
  button:hover{background:#f0eee8}
  button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
  button.primary:hover{background:#265a2f}
  .seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
  .seg button{border:none;border-radius:0;background:#fff;padding:5px 14px;font-size:13.5px}
  .seg button+button{border-left:1px solid var(--line)}
  .seg button.active{background:var(--accent);color:#fff}
  .app{display:grid;grid-template-columns:370px 1fr;gap:16px;padding:16px 20px;align-items:start}
  .app.nosb{grid-template-columns:1fr}
  input[type=checkbox].chk{flex:none;width:18px;height:18px;margin:1px 0 0;accent-color:var(--accent);cursor:pointer}

  /* wie: ronde knopjes, meerdere personen of niemand */
  .who{display:flex;gap:4px;flex:none}
  .wbtn{width:22px;height:22px;padding:0;border-radius:50%;font-size:11px;font-weight:700;line-height:1;
    border:1.5px dashed var(--pcl);color:var(--pc);background:transparent}
  .wbtn:hover{background:#fff;border-color:var(--pc)}
  .wbtn.on{background:var(--pc);border:1.5px solid var(--pc);color:#fff}
  .wd{flex:none;display:inline-flex;align-items:center;justify-content:center;width:20px;height:20px;border-radius:50%;
    background:var(--pc);color:#fff;font-size:10px;font-weight:700;box-shadow:0 0 0 2px #fff}

  /* doel en klant: gelabelde regels */
  .meta{display:flex;flex-direction:column;gap:3px;min-width:0}
  .mrow{display:flex;gap:8px;align-items:baseline;min-width:0;font-size:12.5px}
  .mrow .k{flex:none;width:54px;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
  .mrow .v{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
  .mrow.goal .v{color:var(--tbd);font-weight:600}
  .mrow.client .v{color:#2a2a2a}
  .mrow select.gsel{flex:1;min-width:0;max-width:100%;font:inherit;font-size:12.5px;font-weight:600;color:var(--tbd);
    background:transparent;border:1px solid transparent;border-radius:5px;padding:0 2px;cursor:pointer;text-overflow:ellipsis}
  .mrow select.gsel:hover{border-color:var(--line);background:#fff}
  .mrow select.gsel.none{color:var(--muted);font-weight:400;font-style:italic}
  .mrow select.gsel option{color:#232323;font-weight:400;font-style:normal}
  .gc{font-size:12.5px;color:var(--muted);white-space:nowrap}

  /* sidebar */
  .side{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px;position:sticky;top:12px;max-height:calc(100vh - 24px);overflow-y:auto}
  .sbtop{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
  .side h2{font-size:13px;margin:0;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}
  .sbbtns{display:flex;gap:6px}
  .side select{font:inherit;font-size:13px;padding:3px 6px;border:1px solid var(--line);border-radius:6px;background:#fff;min-width:0}
  .side .mrow select.gsel{border-color:transparent;background:transparent;padding:0 2px;font-size:12.5px}
  .side .mrow select.gsel:hover{border-color:var(--line);background:#fff}

  /* zoeken, filteren, groeperen */
  .fbar{display:flex;flex-direction:column;gap:8px;margin-bottom:12px}
  .fbar input[type=search]{font:inherit;font-size:14px;padding:7px 10px;border:1px solid var(--line);border-radius:6px;width:100%}
  .frow{display:flex;align-items:flex-end;justify-content:space-between;gap:8px}
  .fgroup{display:flex;flex-direction:column;gap:4px}
  .fbar .fl{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
  .fgroup .seg button{padding:5px 12px;font-size:13px}
  #btnFilter{font-size:13px;padding:6px 12px}
  #btnFilter.active{border-color:var(--accent);color:var(--accent);font-weight:600}
  #btnFilter .fcount{display:inline-block;min-width:18px;margin-left:6px;padding:0 5px;border-radius:999px;background:var(--accent);color:#fff;font-size:11.5px;line-height:18px;text-align:center}
  .fpanel{display:grid;grid-template-columns:1fr;   /* één kolom: een open lijst schuift enkel de velden eronder omlaag en het veld zelf blijft op zijn plaats */
    gap:10px;padding:10px;border:1px solid var(--line);border-radius:8px;background:#faf9f5}
  .fpanel[hidden]{display:none}
  .fpanel .f{display:block;margin:0}
  .fpanel select{width:100%;font:inherit;font-size:13.5px;padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:#fff}
  .fclear{display:flex;align-items:flex-end;justify-content:flex-end}
  .fclear button{border:none;background:none;color:var(--muted);font-size:13px;padding:6px 2px;text-decoration:underline}
  .fclear button:hover{background:none;color:#b3261e}
  .fclear button:disabled{opacity:.4;cursor:default;text-decoration:none}

  /* lijsten onder elkaar, open en dicht te klappen */
  .sec{border:1px solid var(--line);border-radius:8px;margin-bottom:8px;background:#fcfbf9}
  .sh{display:flex;align-items:center;gap:8px;padding:9px 11px;cursor:pointer;user-select:none;border-radius:8px}
  .sh:hover{background:#f4f2ec}
  .sec .sl{color:var(--text);font-weight:600}
  .sec.closed .sl{color:#85817a;font-weight:500}
  .sec:not(.closed)>.sh{background:#f6f4ee;border-radius:7px 7px 0 0}
  .chev{display:inline-block;width:12px;font-size:11px;color:var(--muted);transition:transform .15s}
  .sec:not(.closed) .chev{transform:rotate(90deg)}
  .sl{flex:1;font-weight:600;font-size:14px}
  .sec .cnt{font-size:12px;color:var(--muted);background:#f0eee8;border-radius:10px;padding:0 8px}
  .sb{padding:10px;border-top:1px solid var(--line)}
  .dragging-any .sec:not([data-list="planned"]){outline:2px dashed var(--accent);outline-offset:1px}
  .dragging-any .sec[data-list="planned"]{opacity:.5}
  .sec.over{outline:2px solid var(--accent) !important;background:var(--hover)}

  .list-tasks{display:flex;flex-direction:column;gap:10px}
  .group{margin-bottom:14px}
  .group:last-child{margin-bottom:0}
  .gh{display:flex;align-items:baseline;gap:8px;margin-bottom:8px;padding-bottom:4px;border-bottom:2px solid var(--line)}
  .gh .gname{font-weight:600;flex:1;min-width:0}
  .gh .gn{font-size:12px;color:var(--muted);white-space:nowrap}
  .task.late,.chip.late{box-shadow:inset 0 0 0 3px #d92d20}
  .mrow.deadline.due .v{color:#b45309;font-weight:600}
  .mrow.deadline.late .v{color:#d92d20;font-weight:600}
  .task{display:flex;align-items:flex-start;gap:10px;padding:10px 10px;border-radius:8px;border:1px solid var(--tb);border-left:5px solid var(--tb);background:var(--tbg);cursor:grab}
  .task.done,.chip.done{opacity:.65}
  .task.done .title,.chip.done .t{text-decoration:line-through}
  .task .body{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
  .task .trow{display:flex;align-items:flex-start;gap:8px}
  .task .title{flex:1;min-width:0;font-size:14.5px;font-weight:600}
  .task .desc{font-size:13px;line-height:1.45;color:#46433b}
  .task .desc.none{color:var(--muted);font-style:italic}
  .task textarea{font:inherit;font-size:13px;width:100%;min-height:56px;padding:6px 8px;border:1px solid var(--tb);border-radius:6px;background:#fff}
  .mrow.plan{align-items:flex-start}
  .mrow.plan .v.links{display:flex;flex-direction:column;align-items:flex-start;gap:1px;white-space:normal;overflow:visible}
  .gl{border:none;background:none;padding:0;font:inherit;font-size:12.5px;font-weight:600;color:var(--tbd);cursor:pointer;text-align:left}
  .gl:hover{background:none;text-decoration:underline}
  .task .acts{display:flex;flex-direction:column;gap:2px}
  .task .acts button{border:none;background:none;color:var(--muted);padding:0 3px;font-size:16px;line-height:1.2}
  .task .acts button:hover{color:#000;background:none}
  .task,.chip{transition:opacity .12s, box-shadow .12s}
  .task.hl,.chip.hl{box-shadow:0 0 0 3px var(--tb),0 6px 16px rgba(0,0,0,.2);position:relative;z-index:2}
  body.hov .task:not(.hl),body.hov .chip:not(.hl){opacity:.35}
  body.hov .chip.same{opacity:1}   /* de andere plekken van de gemarkeerde taak: niet omrand, niet gedimd */
  .hint{margin-top:12px;color:var(--muted);font-size:12.5px}
  .none-msg{color:var(--muted);font-size:13.5px}

  /* popups */
  dialog{border:none;border-radius:12px;padding:20px;width:min(440px,92vw);box-shadow:0 12px 40px rgba(0,0,0,.25);color:var(--text);font:inherit}
  dialog.wide{width:min(780px,94vw);max-height:86vh;overflow:auto}
  dialog::backdrop{background:rgba(30,30,25,.35)}
  dialog h3{margin:0 0 14px;font-size:17px}
  dialog label.f,dialog div.f{display:block;margin-bottom:12px}
  #toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:#2b2a27;color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;box-shadow:0 6px 24px rgba(0,0,0,.25);z-index:50;max-width:80vw}
  #toast[hidden]{display:none}
  .swatches{display:flex;flex-wrap:wrap;gap:8px;margin-top:4px}
  .swatches button{width:28px;height:28px;border-radius:50%;border:2px solid #fff;padding:0;cursor:pointer;box-shadow:0 0 0 1px rgba(0,0,0,.18)}
  .swatches button[aria-pressed="true"]{box-shadow:0 0 0 2px var(--text)}
  dialog .fl,.ibextra .fl,.ibform .fl{display:block;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin-bottom:4px}
  dialog input[type=text],dialog input[type=date],dialog textarea,dialog select{box-sizing:border-box;font:inherit;font-size:14.5px;width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:6px;background:#fff}
  dialog textarea{min-height:70px;resize:vertical}
  dialog .wrow{display:flex;gap:6px}
  dialog .wtog,.ibextra .wtog{padding:6px 14px;border-radius:999px;border:1.5px dashed var(--pcl);color:var(--pc);background:#fff;font-weight:600}
  dialog .wtog.on,.ibextra .wtog.on{background:var(--pc);border:1.5px solid var(--pc);color:#fff}
  #goalDlg{overflow:visible}
  .combo{position:relative}
  .combolist{position:absolute;left:0;right:0;top:calc(100% + 4px);z-index:20;background:#fff;border:1px solid var(--line);border-radius:10px;
    box-shadow:0 8px 22px rgba(0,0,0,.16);padding:4px;max-height:260px;overflow:auto}
  .combolist .ch{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);padding:8px 10px 4px}
  .combolist button{display:flex;justify-content:space-between;gap:10px;width:100%;text-align:left;border:0;background:none;font:inherit;font-size:14.5px;padding:9px 10px;border-radius:7px;cursor:pointer;color:var(--text)}
  .combolist button:hover{background:#eef6ee}
  .combolist button small{color:var(--muted);font-size:12.5px;white-space:nowrap}
  .combolist .new-opt{color:var(--accent);font-weight:600;justify-content:flex-start}
  .cnote{margin-top:6px;font-size:13px;color:var(--accent);font-weight:600}
  dialog .btns{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}
  dialog .btns .danger{margin-right:auto;color:#b3261e;border-color:#e3c2bf}
  dialog .btns .danger:hover{background:#fbeceb}
  dialog .btns .danger.confirm{background:#b3261e;border-color:#b3261e;color:#fff;font-weight:600}
  .pen{border:none;background:none;color:var(--muted);padding:0 3px;font-size:16px;line-height:1.2;cursor:pointer}
  .pen:hover{background:none;color:#000}

  /* beheer */
  .mhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
  .mhead h3{margin:0}
  .msec{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin-bottom:8px}
  .mlist{display:flex;flex-direction:column;gap:8px;margin-bottom:14px}
  .mitem{display:grid;grid-template-columns:1fr 90px 150px;gap:8px;align-items:center}
  .mitem .mcnt{font-size:12.5px;color:var(--muted);white-space:nowrap}
  .mdel{border:none !important;background:none !important;color:var(--muted);font-size:13px;text-align:right;padding:4px 0}
  .mdel:hover{color:#b3261e}
  .mtabs{margin-bottom:14px}
  .mhint{margin:0 0 12px;color:var(--muted);font-size:13.5px}
  .mday{margin-bottom:14px}
  .msec.big{font-size:12px;margin-bottom:2px}
  .wk{display:grid;grid-template-columns:22px repeat(7,1fr);gap:6px;margin-bottom:14px}
  .wkh{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);text-align:center;margin-bottom:4px}
  .wkaxi{position:relative}
  .wkaxi span{position:absolute;right:0;transform:translateY(-6px);font-size:10.5px;color:var(--muted)}
  .wkcol{position:relative;border:1px solid var(--line);border-radius:6px;background-color:#faf9f5;background-image:linear-gradient(var(--line) 1px,transparent 1px)}
  .wk{user-select:none;-webkit-user-select:none}
  .wkcol{cursor:crosshair;touch-action:none}
  .wkb{position:absolute;left:2px;right:2px;display:flex;flex-direction:column;gap:1px;text-align:left;padding:4px 4px;font-size:10.5px;line-height:1.2;border:1px solid var(--accent);background:#e3f0e3;border-radius:5px;overflow:hidden;cursor:grab;color:var(--text)}
  .wkb:active{cursor:grabbing}
  .wkb.ghost{background:#cfe6d1;border-style:dashed;pointer-events:none}
  .hnd{position:absolute;left:0;right:0;height:7px;cursor:ns-resize}
  .hnd.t{top:0}.hnd.b{bottom:0}
  .hnd.b::after{top:auto !important;bottom:2px}
  .wkb:hover .hnd::after,.wkb.sel .hnd::after{content:'';position:absolute;left:50%;margin-left:-8px;width:16px;height:3px;border-radius:2px;background:currentColor;opacity:.45;top:2px}
  .mhow{margin:0 0 12px;font-size:13.5px;color:var(--text);background:#f1f8f1;border-radius:6px;padding:7px 10px}
  .wkb b{font-weight:600}
  .wkb:hover{background:#d3e8d4}
  .wkb.sel{background:var(--accent);color:#fff;box-shadow:0 0 0 2px #9fc3a4}
  .wkclr{display:block;width:100%;height:30px;margin-top:8px;padding:0}
  div.wkclr{visibility:hidden}
  button.wkclr{font-size:12.5px;color:var(--text)}
  button.wkclr:hover{color:#b3261e;border-color:#e3c2bf;background:#fbeceb}
  button.wkclr.on{color:#b3261e;border-color:#b3261e;background:#fbeceb;font-weight:600}
  .gconf.dayconf{margin-bottom:14px;background:#fbeceb;border:1px solid #e3c2bf}
  .bedit{border-top:1px solid var(--line);padding-top:12px}
  .bedit.none{color:var(--muted);font-size:13.5px}
  .bcopy{margin-top:12px}
  .bcopy .wrow{margin-bottom:8px;flex-wrap:wrap}
  .bcopy .wtog{padding:4px 11px;font-size:13px}
  .bcopy .dgo{background:#b3261e;border-color:#b3261e;color:#fff;font-weight:600}
  .mblk{display:grid;grid-template-columns:96px auto 96px 1fr 26px;gap:8px;align-items:center;margin-bottom:6px}
  .mblk .mto{color:var(--muted);font-size:13px}
  .mblk select{width:100%}
  .mblk input[type=text]{min-width:0}
  .mblk .mdel{grid-column:4 / 6;white-space:normal;text-align:right}
  .madd1{border:none;background:none;color:var(--accent);font-weight:600;padding:2px 0}
  .madd1:hover{background:none;text-decoration:underline}
  .mact button:disabled{opacity:.45;cursor:default}
  .mact{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px}
  .mstate{color:var(--muted);font-size:13.5px;margin:0 0 12px}
  .mlen{display:flex;gap:8px}
  .mlen input{width:90px;flex:none}
  .mlen select{width:auto;flex:none;min-width:110px}
  .musr{display:grid;grid-template-columns:34px 1fr 150px;gap:8px;align-items:center}
  .musr input[type=color]{width:34px;height:34px;padding:2px;border:1px solid var(--line);border-radius:6px;background:#fff;cursor:pointer}
  .merr{margin-bottom:10px;padding:8px 10px;border-radius:6px;background:#fbeceb;color:#b3261e;font-size:13.5px}
  .mempty.none{margin-bottom:4px;font-size:13.5px}
  .mlock{text-align:right;white-space:normal;line-height:1.25}
  .mdel.confirm{color:#b3261e;font-weight:600;white-space:normal;line-height:1.25}
  .madd{display:flex;gap:8px;padding-top:14px;border-top:1px solid var(--line)}
  .madd input{flex:1}
  .mempty{color:var(--muted);margin-bottom:14px}

  /* doelen */
  .goalsview{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px}
  .gtoolbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:18px}
  .gtoolbar h2{margin:0;font-size:17px;flex:1}
  .gtoolbar label{font-size:13.5px;color:var(--muted);display:flex;align-items:center;gap:6px;cursor:pointer}
  .cgroup{margin-bottom:24px}
  .cghead{display:flex;align-items:baseline;gap:10px;margin-bottom:10px;padding-bottom:4px;border-bottom:2px solid var(--line)}
  .cghead .cn{font-weight:700;font-size:15px}
  .cghead .cc{color:var(--muted);font-size:12.5px}
  .gcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:12px}
  .gcard{display:flex;flex-direction:column;gap:9px;padding:11px 13px;border-radius:8px;border:1px solid var(--tb);border-left:5px solid var(--tb);background:var(--tbg)}
  .gcard{cursor:pointer;transition:box-shadow .12s}
  .gcard:hover{box-shadow:0 4px 14px rgba(0,0,0,.14)}
  .gcard.ach{opacity:.8;background:#f1f0ea;border-color:#d4d1c6;border-left-color:#b9b5a8}
  .gcard.ach .bar i{background:#9a968c}
  .gbadge{flex:none;font-size:11.5px;font-weight:600;color:var(--accent);background:#e3f0e3;border-radius:999px;padding:2px 9px;white-space:nowrap}
  .gname{font-size:15px;flex:1;min-width:0}
  .gdesc{font-size:13px;line-height:1.4;color:#46433b;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  dialog.gvw{width:min(680px,94vw)}
  .ico.sm{align-self:center}
  .gvtools{display:flex;gap:8px;align-items:center}
  .ico{border:none;background:none;color:var(--muted);padding:0 3px;font-size:16px;line-height:1.2;cursor:pointer}
  .ico:hover{background:none;color:#000}
  .gvv{font-size:14.5px;line-height:1.5;color:var(--text)}
  .gvv.none{color:var(--muted);font-style:italic}
  dialog.gvw.editing{overflow:visible}
  .gvlist{display:flex;flex-direction:column;gap:6px}
  .gvt{display:flex;align-items:center;gap:10px;padding:8px 10px;border:1px solid var(--tb);border-left:5px solid var(--tb);background:var(--tbg);border-radius:6px}
  .gvt .gvtt{flex:1;min-width:0;font-weight:600;font-size:14px}
  .gvt.done .gvtt{text-decoration:line-through;opacity:.7}
  .gvt .gvts{font-size:12.5px;color:var(--muted);white-space:nowrap}
  .gvacts{display:flex;justify-content:flex-end;gap:8px;padding-top:14px;border-top:1px solid var(--line)}
  .gvacts .ok{border-color:var(--accent);color:var(--accent);font-weight:600}
  .gtop{display:flex;align-items:center;gap:8px}
  .gtop .gpeople{display:flex;gap:4px;flex:none;align-items:center}
  .gcard input.gn{flex:1;min-width:0;font:inherit;font-weight:600;font-size:15px;color:var(--text);background:transparent;
    border:1px solid transparent;border-radius:5px;padding:2px 4px}
  .gcard input.gn:hover,.gcard input.gn:focus{border-color:var(--line);background:#fff}
  .bar{height:6px;border-radius:4px;background:rgba(0,0,0,.09);overflow:hidden}
  .bar i{display:block;height:100%;background:var(--tb)}

  .ms summary::-webkit-details-marker{display:none}
  .ms summary::after{content:'▾';position:absolute;right:9px;top:50%;transform:translateY(-50%);font-size:11px;color:var(--muted)}
  .ms summary.on{border-color:var(--accent);color:var(--accent);font-weight:600}
  .ms .msb{position:absolute;z-index:30;top:calc(100% + 4px);left:0;min-width:100%;max-height:260px;overflow:auto;background:#fff;border:1px solid var(--line);border-radius:8px;box-shadow:0 8px 24px rgba(0,0,0,.15);padding:6px}
  .ms .msb label{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:6px;font-size:13.5px;white-space:nowrap;cursor:pointer}
  .ms .msb label:hover{background:var(--hover)}
  .msbk{display:none}
  .ms .msb.rows{padding:6px 0}
  .ms .msb .gph:first-child{border-top:none;margin-top:0}
  .ms .msb label.msr{display:flex;align-items:center;gap:10px;padding:8px 14px 8px 22px;border-radius:0;white-space:normal}
  .ms .msb label.msr .gpt{flex:1;min-width:0}
  .ms .msb label.msr input{order:3;flex:none;width:18px;height:18px;margin:0;accent-color:var(--accent)}
  .ms .msb.chips{display:flex;flex-wrap:wrap;gap:6px;padding:8px}
  .ms .msb label.mswho{padding:5px 12px;border-radius:999px;border:1.5px dashed var(--pcl);color:var(--pc);font-weight:600;background:#fff}
  .ms .msb label.mswho{position:relative}
  .ms .msb label.mswho input{position:absolute;inset:0;width:100%;height:100%;margin:0;opacity:0;cursor:pointer}
  .ms .msb label.mswho:has(input:checked){background:var(--pc);border:1.5px solid var(--pc);color:#fff}
  .ms .msb label.mswho:hover{background:#fff}
  .ms .msb label.mswho:has(input:checked):hover{background:var(--pc)}
  .fpanel .ms .msb{position:static;margin-top:4px;box-shadow:none;max-height:none}
  .fpanel .ms .msb{overflow-x:hidden}   /* in de zijbalk klapt de lijst uit tussen de velden, zodat ze niets afdekt */
  .fpanel .f{min-width:0}
  .fpanel .ms .msb label{white-space:normal}
  .lfilter .f{display:block;margin:0}
  .lfilter .fl{display:block;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin-bottom:3px}
  #lfToggle,#vwToggle{display:none;font-size:13px;padding:6px 12px}
  #vwToggle[aria-expanded=true]{border-color:var(--accent);color:var(--accent);font-weight:600}
  #lfToggle.active{border-color:var(--accent);color:var(--accent);font-weight:600}
  #lfToggle .fcount{display:inline-block;min-width:18px;margin-left:6px;padding:0 5px;border-radius:999px;background:var(--accent);color:#fff;font-size:11.5px;line-height:18px;text-align:center}
  @media (max-width:700px),(max-height:500px){   /* gsm, ook liggend: de zijbalk (linkerlijst) staat altijd onder de rechterweergave, nooit ernaast */
    .app{grid-template-columns:minmax(0,1fr)}
    #weekView,#inboxView,#goalsView{order:-1;min-width:0}
    .side{position:static;max-height:none;overflow-y:visible}
  }
  @media (max-width:700px){   /* gsm: de filters van de Lijst klappen dicht achter een knop, en de weergaveknoppen schuiven op een eigen rij */
    .listmode #lfToggle,#vwToggle{display:inline-block}
    .app{grid-template-columns:minmax(0,1fr)}   /* één kolom: de zijbalk komt onder de kalender */
    #weekView{order:-1;min-width:0}
    #modeSeg.open{flex-wrap:wrap;overflow:visible}   /* kalenderweergaven: eerst de kalender, dan de zijbalk, zodat de knop Weergave bovenaan staat */
    #modeSeg{display:none}
    #modeSeg.open{display:flex;width:100%;box-sizing:border-box}
    /* Lijst op de gsm: de doelnaam volledig (over meerdere regels) en zonder de labels Doel en Klant, de kleur van de kaart zegt genoeg */
    .listview .mrow.goal .k,.listview .mrow.client .k{display:none}
    .listview .mrow.goal .v,.listview .mrow.client .v{white-space:normal;overflow:visible}
    .listview .mrow.client .v{color:var(--muted);font-size:12px}
    /* taakvenster: Verwijder taak op een eigen rij en de doelnaam mag wrappen */
    dialog .btns{flex-wrap:wrap}
    dialog .btns .danger{order:3;flex:1 1 100%;margin-right:0}
    .gp .gpb .gpn{white-space:normal;overflow:visible}
    /* Werkperiode op de gsm: elke werkperiode over de volle breedte, veeg opzij voor de volgende */
    .cymode .cyview{overflow-x:auto;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch}
    .cyhead,.cybody{overflow:visible;width:calc(var(--n,1)*100%);grid-template-columns:repeat(var(--n,1),minmax(0,1fr)) !important}
    .cyhead>div,.cycol{scroll-snap-align:start;scroll-snap-stop:always}
    /* kalenderbalk op de gsm: knoppen op één rij, de titel op de volle breedte eronder, en geen kop met dezelfde data nog eens */
    .week .calbar{gap:8px 8px;padding:8px 10px}
    .week .calbar .nav{gap:4px}
    .week .calbar .nav button{padding:5px 7px;font-size:13.5px}
    .week #vwToggle,.week #lfToggle{padding:5px 8px;font-size:13.5px}
    /* filters op de gsm: dezelfde gecentreerde lijst als de Doel-kiezer */
    .ms[open] .msbk{display:block;position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.35)}
    .fpanel .ms[open] .msb,.lfilter .ms[open] .msb,.ms[open] .msb{position:fixed !important;left:8px !important;right:8px !important;top:50% !important;bottom:auto !important;transform:translateY(-50%);width:auto !important;min-width:0 !important;max-width:none !important;max-height:88dvh !important;margin:0 !important;z-index:41;border:0;border-radius:18px;box-shadow:0 12px 40px rgba(0,0,0,.35);padding:4px 0}
    .ms[open] .msb.chips{padding:12px;gap:10px}
    .ms[open] .msb label.msr{font-size:19px;padding:14px 16px 14px 20px}
    .ms[open] .msb label.msr input{width:24px;height:24px}
    .ms[open] .msb label.mswho{font-size:18px;padding:9px 18px}
    .ms[open] .msb .gph{font-size:13px;padding:12px 16px 4px}
    .week .calbar .nav{order:1}
    #vwToggle{order:2}
    .week .calbar .callabel{order:3;flex:1 1 100%;min-width:0}
    .week .calbar .callabel .calbtn{flex:1;justify-content:space-between;font-size:15px;padding:6px 10px}
    #modeSeg.open{order:4}
    .cymode .cyhead,.daymode #head{display:none}
    /* werkperiodebalk bovenaan (Dag, Werkweek, Week): de taken van de periode naast elkaar, één volle kaart met een stukje van de vorige en de volgende, veeg om te wisselen */
    .cycle .list{flex-wrap:nowrap;overflow-x:auto;scroll-snap-type:x mandatory;scroll-padding:0 14px;-webkit-overflow-scrolling:touch;scrollbar-width:none;margin:0 -10px;padding:0 10px}
    .cycle .list::-webkit-scrollbar{display:none}
    .cycle .chip{flex:0 0 84%;min-width:0;max-width:none;scroll-snap-align:start}
    .cycle .chip:only-child{flex-basis:100%}
    #cycleLane{display:block}
    #cycleLane .cycle{grid-column:auto !important;grid-row:auto !important;margin:0 8px 8px;border:1px dashed #bcb7d8 !important;border-radius:10px !important}   /* over de volle breedte, ook onder de tijdkolom, en gestapeld als er meer werkperiodes in beeld zijn */
    .listmode .lfilter{display:none}
    .listmode #lfToggle,#vwToggle{order:1}
    .listmode .lfilter.open{display:grid;grid-template-columns:1fr 1fr;gap:8px;width:100%;order:2;margin-right:0}
    .listmode .calbar{padding:6px 10px;border-bottom:none}
    .listmode .listview{max-height:none;overflow:visible;padding:4px 10px 16px}   /* de pagina scrolt zelf, zodat de balken mee wegscrollen */
    .listmode #vwToggle{margin-right:auto}
    .listmode .lfilter .f:nth-child(3) .msb{left:auto;right:0}
    .listmode .lfilter .msb{max-width:calc(100vw - 56px)}
    .listmode .lfilter .msb label{white-space:normal}
    #modeSeg button{padding:5px 10px}
    .listmode .lfilter .ms,.listmode .lfilter input[type=search]{width:100%}
    .listmode .lfilter{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
    .listmode .lfilter .f{min-width:0}
    .listmode .lfilter .f:first-child,.listmode #lfClear{grid-column:1 / -1}
    .listmode .lfilter #lfClear{justify-self:start}
    .listmode #modeSeg{margin-left:0}
    #modeSeg{max-width:100%;overflow-x:auto}
    #modeSeg button{flex:none}
  }
  @media (max-width:340px){ .ibextra{grid-template-columns:1fr !important} }   /* heel smalle gsm: doel en deadline onder elkaar */
  .lfilter .ms{width:130px}
  .lfilter input[type=search]{font:inherit;font-size:13.5px;padding:6px 8px;border:1px solid var(--line);border-radius:6px;width:170px;box-sizing:border-box}
  .lfilter button{padding:6px 12px;font-size:13px}

  .lgrp>h4{font-size:13.5px;margin:0 0 6px;color:var(--muted);font-weight:600;display:flex;gap:8px;align-items:baseline}

  .cyview{display:none}

  .cymode #head,.cymode #cycleLane,.cymode #body{display:none !important}
  @media (pointer:coarse){ #head,#body{touch-action:pan-y} }   /* de browser doet enkel het verticale scrollen, het zijwaartse veegen is voor de kalender zelf */
  .cyhint{display:none;position:sticky;left:0;width:100%;box-sizing:border-box;text-align:center;font-size:12px;font-weight:600;color:#7c779f;padding:6px 0 0}

  .cyhead,.cybody{display:grid;overflow-x:auto}

  .head,.body{display:grid;grid-template-columns:56px repeat(5,minmax(0,1fr))}

  .ibform{display:flex;flex-direction:column;gap:10px;margin-bottom:16px}
  .ibform > label.f{display:block;margin:0}
  .ibform > label.f input{width:100%;box-sizing:border-box;font:inherit;font-size:16px;padding:10px 12px;border:1px solid var(--line);border-radius:6px;background:#fff}
  .iboptlbl{border-top:1px solid var(--line);margin:2px 0}
  .ibsubmit{display:flex;justify-content:flex-end}
  .ibsubmit button{padding:10px 22px;font-size:15px}
  /* op elk scherm: de knop Toevoegen over de volle breedte en vast onderaan in beeld; een vervaging en een hint tonen dat er nog velden onder zitten */
  .ibsubmit{position:sticky;bottom:0;z-index:5;flex-direction:column;align-items:stretch;gap:6px;margin:0;padding:22px 0 8px;background:linear-gradient(to bottom,rgba(255,255,255,0),#fff 22px);pointer-events:none}
  .ibsubmit button{width:100%;padding:13px;font-size:16px;pointer-events:auto}
  /* doelkiezer: de gewone keuzelijst blijft de waarde bewaren, de kiezer toont ze gegroepeerd per klant (zoals de Doelen) met de kleur van het doel */
  .gpsel{display:none !important}
  .gp{position:relative}
  .gp .gpb{display:flex;align-items:center;gap:10px;width:100%;box-sizing:border-box;text-align:left;font:inherit;font-size:14px;padding:8px 10px;border:1px solid var(--line);border-radius:6px;background:#fff !important;color:var(--ink,#222);cursor:pointer}
  .gpb .gpn{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .gpb .gpn.ph{color:var(--muted)}
  .gpb::after{content:"";width:7px;height:7px;border-right:1.5px solid currentColor;border-bottom:1.5px solid currentColor;transform:rotate(45deg) translateY(-2px);flex:none;opacity:.7}
  .gp.open .gpb{border-color:var(--accent)}
  .gpd{width:12px;height:12px;border-radius:50%;flex:none}
  .gpp{display:none;position:absolute;left:0;right:0;top:calc(100% + 4px);z-index:30;max-height:60vh;overflow-y:auto;background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:0 8px 22px rgba(0,0,0,.16);padding:6px 0;scroll-margin-bottom:90px}
  .gp.open .gpp{display:block}
  .dwrap{display:flex;align-items:center;gap:8px}
  .dwrap input{flex:1;min-width:0;width:auto !important}
  .dwrap .dkf{flex:1;min-width:0;display:flex;flex-wrap:wrap;align-items:center;gap:2px 10px;text-align:left;padding:9px 12px;border:1px solid var(--line);border-radius:8px;background:#fff;font-size:15px;color:var(--text);cursor:pointer}
  .dwrap .dkph{color:var(--muted)}
  .dkrep{color:var(--accent);font-weight:600;white-space:nowrap}
  .mrow .dkrep{color:var(--muted);font-weight:500}
  .mrow.deadline .v{white-space:normal;overflow:visible}
  .repi{vertical-align:-2px}
  .f.bad input,.f.bad textarea,.f.bad .gpb,.f.bad select{border-color:#d92d20 !important;box-shadow:0 0 0 1px #d92d20}
  .f.bad input:focus,.f.bad textarea:focus{outline-color:#d92d20 !important;border-color:#d92d20 !important}
  .ferr{margin-top:4px;color:#d92d20;font-size:12.5px;font-weight:600}
  .rephint{margin:-4px 0 12px;padding:8px 10px;border-radius:8px;background:#fff4dc;border:1px solid #efce8a;color:#6b4300;font-size:13.5px;font-weight:600;display:flex;align-items:center;gap:8px}
  .rephint .repi{flex:none}
  .dkbk{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.35)}
  .dkpop{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:61;width:min(340px,calc(100vw - 24px));max-height:calc(100vh - 24px);overflow:auto;box-sizing:border-box;background:#fff;color:var(--text);border-radius:14px;box-shadow:0 14px 44px rgba(0,0,0,.3);padding:14px}
  .dkpop .dkh{display:flex;align-items:center;gap:6px;margin-bottom:8px}
  .dkpop .dkh{gap:4px}
  .dkpop .dkh select{flex:1 1 0;min-width:0;font:inherit;font-size:13.5px;font-weight:600;padding:6px 0 6px 4px;border:1px solid var(--line);border-radius:8px;background:#fff}
  .dkpop .dkh select#dkY{flex:0 0 66px}
  .dkpop .dkh button{flex:none;width:32px;height:36px;padding:0;font-size:18px}
  .dkpop .dkw,.dkpop .dkg{display:grid;grid-template-columns:repeat(7,1fr);text-align:center}
  .dkpop .dkw span{font-size:11px;font-weight:700;text-transform:uppercase;color:var(--muted);padding:2px 0}
  .dkpop .dkd{height:38px;padding:0;border:0;border-radius:50%;background:transparent;font-size:15px}
  .dkpop .dkd:hover{background:#eceae3}
  .dkpop .dkd.today{box-shadow:inset 0 0 0 1.5px var(--accent)}
  .dkpop .dkd.sel{background:var(--accent);color:#fff;font-weight:700}
  .dkpop .dkl{display:flex;align-items:center;gap:6px;margin:12px 0 6px;padding-top:10px;border-top:1px solid var(--line);font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
  .dkpop .dkpills{display:flex;flex-wrap:wrap;gap:6px}
  .dkpop .dkpill{padding:6px 11px;border-radius:999px;border:1.5px solid var(--line);background:#fff;font-size:13.5px}
  .dkpop .dkpill.on{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
  .dkpop .dkpill:disabled{opacity:.45;cursor:default}
  .dkpop .dkcus{display:flex;align-items:center;gap:8px;margin-top:10px}
  .dkpop .dkcus input,.dkpop .dkcus select{font:inherit;font-size:14px;padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:#fff}
  .dkpop .dkcus input{width:64px}
  .dkpop .dkbtns{display:flex;justify-content:flex-end;gap:8px;margin-top:14px}
  .dwrap .dclr{display:none;flex:none;width:34px;height:34px;padding:0;border-radius:50%;background:#ece9e1;color:#555;font-size:20px;line-height:1;cursor:pointer}
  .dwrap.has .dclr{display:block}
  .gpbk{display:none}
  .gpr{display:none}
  @media (max-width:700px),(max-height:500px){   /* klein scherm: de lijst komt als blad onderaan, boven de rest, zoals de gewone keuzelijst van de gsm */
    .gp.open .gpbk{display:block;position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.35)}
    .gp .gpp{position:fixed;left:8px;right:8px;top:50%;bottom:auto;transform:translateY(-50%);z-index:41;max-height:88vh;max-height:88dvh;border:0;border-radius:18px;padding:4px 0;scroll-margin-bottom:0;box-shadow:0 12px 40px rgba(0,0,0,.35)}
    .gp .gpo{font-size:22px;line-height:1.2;padding:14px 16px 14px 20px;gap:12px}
    .gp .gpo.none{padding-left:16px}
    .gp .gpo.on{font-weight:400}
    .gp .gph{font-size:13px;padding:12px 16px 4px}
    .gp .gpd{width:16px;height:16px}
    .gp .gpr{display:block;width:24px;height:24px;box-sizing:border-box;border:2px solid #555;border-radius:50%;flex:none}
    .gp .gpo.on .gpr{border-color:var(--accent);border-width:6px}
  }
  .gph{padding:9px 14px 3px;margin-top:4px;border-top:1px solid #eee;font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
  .gp .gpo{display:flex;align-items:center;gap:10px;width:100%;box-sizing:border-box;text-align:left;font:inherit;font-size:14px;padding:10px 14px 10px 22px;border:0;border-radius:0;background:none;color:inherit;cursor:pointer}
  .gpo.none{padding-left:14px;color:var(--muted)}
  .gpo:hover,.gpo:focus-visible{background:#f4f2ee}
  .gpo.on{font-weight:600}
  .gpo .gpt{flex:1;min-width:0}
  .ibmore{display:block;text-align:center;font-size:12px;font-weight:600;color:var(--muted);margin-bottom:-2px}
  .ibsubmit:not(.more) .ibmore{display:none}
  .ibrow{display:flex;gap:8px}
  .ibextra{display:grid;grid-template-columns:1fr 1fr;gap:10px 12px}
  .ibextra .f{display:block;margin:0}
  .ibextra .wrow{display:flex;gap:6px;flex-wrap:wrap}
  .ibextra .full{grid-column:1 / -1}
  .ibextra textarea,.ibextra select,.ibextra input[type=date]{width:100%;font:inherit;font-size:14px;padding:8px 10px;border:1px solid var(--line);border-radius:6px;background:#fff;box-sizing:border-box}
  .ibextra textarea{resize:vertical;min-height:0}
  .ibrow input{flex:1;min-width:0;font:inherit;font-size:16px;padding:10px 12px;border:1px solid var(--line);border-radius:6px;background:#fff}
  .ibrow button{padding:0 18px;font-size:15px}
  .ibcount{color:var(--muted);font-size:13.5px}
  .ibh2{margin:22px 0 8px;font-size:13px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}
  .ibrec{display:flex;align-items:center;gap:8px;padding:8px 12px;margin-bottom:6px;border:1px solid var(--line);border-radius:8px;background:#fff}
  .ibrec .t{flex:1;min-width:0;overflow-wrap:anywhere}
  .ibrec .x{border:none;background:none;padding:2px 6px;color:var(--muted);font-size:16px;line-height:1}
  .ibrec .x:hover{background:#f0eee8;color:var(--text)}
  .ibhint{margin:0 0 10px;color:var(--muted);font-size:13px}
  .ibgoals{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
  .ibgoal{display:flex;flex-direction:column;align-items:flex-start;gap:1px;text-align:left;padding:7px 12px;border-radius:8px;border:1px solid var(--tb);border-left:5px solid var(--tb);background:var(--tbg);color:var(--tbd);font-size:13.5px;font-weight:600;line-height:1.25}
  .ibgoal small{font-weight:400;font-size:12px;opacity:.85}
  .ibgoal:hover{background:var(--tbg);filter:brightness(.97)}
  .ibgoal.over,.ibcol.over{outline:2px solid var(--accent);outline-offset:1px}
  .ibboard{display:grid;grid-template-columns:minmax(300px,1.5fr) repeat(4,minmax(150px,1fr));gap:12px;align-items:start}
  .ibcol{background:#faf9f5;border:1px solid var(--line);border-radius:10px;padding:10px;min-height:150px}
  .ibcol>.ibh{display:flex;align-items:center;gap:8px;margin:0 0 10px;font-size:13px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
  .ibcol>.ibh .cnt{margin-left:auto;font-weight:600;font-size:12px;background:#ecebe5;border-radius:10px;padding:0 7px;line-height:19px}
  .ibcol.src{background:#fff}
  .ibstack{display:flex;flex-direction:column;gap:10px}
  .ibitem{display:block}
  .ibitem .task{cursor:grab}
  .ibitem .task.sel{box-shadow:0 0 0 2px var(--accent)}
  .ibempty{padding:16px 8px;text-align:center;color:var(--muted);font-size:13px}
  .ibhere{width:100%;margin-bottom:10px;border-style:dashed;color:var(--accent);font-weight:600}
  .ibmini{display:flex;align-items:center;gap:8px;padding:7px 8px;cursor:default;font-size:13px}
  .ibmini .t{flex:1;min-width:0;overflow-wrap:anywhere;font-weight:600}
  .ibmini .n{display:block;font-weight:400;font-size:12px;color:var(--tbd)}
  .ibmini button{border:none;background:none;color:var(--muted);padding:0 3px;font-size:12.5px;white-space:nowrap}
  .ibmini button:hover{color:#000;background:none;text-decoration:underline}
  .ibtop{display:flex;align-items:center;justify-content:flex-end;gap:12px;margin-bottom:12px;flex-wrap:wrap}
  .ibtop .ibhint{flex:1;min-width:220px;margin:0}
  .ibundolbl{color:var(--muted);font-size:13px;max-width:420px;text-align:right}
  .ibundolbl b{color:var(--text);font-weight:600}
  .ibboard{grid-template-columns:minmax(280px,340px) minmax(0,1fr)}
  .ibsrc{margin-bottom:0;position:sticky;top:12px;max-height:calc(100vh - 24px);overflow-y:auto}
  .ibsrc>.sh{cursor:default}
  .ibsrc>.sh:hover{background:#f6f4ee}
  .ibclients{display:flex;gap:14px;align-items:flex-start;min-width:0}
  .ibcolm{flex:1 1 0;min-width:0;display:flex;flex-direction:column;gap:14px}
  .ibgoals2 .gname{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block;font-size:14px}
  .ibgoals2 .gtop{min-width:0}
  .ibgoals2 .gcard{gap:6px;padding:8px 10px}
  .ibitem .task{cursor:pointer}
  .ibclient{min-width:0}
  .ibgoals2{display:flex;flex-direction:column;gap:8px}
  .ibgoals2 .gcard{cursor:default}
  .ibbks{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .ibbk{display:flex;align-items:center;justify-content:center;text-align:center;min-height:88px;padding:8px 6px;border-radius:8px;border:1.5px dashed var(--tb);background:rgba(255,255,255,.65);color:var(--tbd);font-size:13.5px;font-weight:600;line-height:1.25}
  .ibbk:hover{background:#fff}
  .ibbk.over{outline:2px solid var(--accent);outline-offset:1px;background:#fff}
  .gcard.over{outline:2px solid var(--accent);outline-offset:1px}
  .seg .nbadge{display:inline-block;min-width:18px;padding:0 5px;margin-left:6px;border-radius:9px;background:#ecebe5;color:var(--muted);font-size:12px;line-height:18px;text-align:center}
  .seg button.active .nbadge{background:rgba(255,255,255,.25);color:#fff}
  .seg .nbadge:empty{display:none}
  @media (max-width:1000px){ .ibboard{grid-template-columns:1fr} .ibsrc{position:static;max-height:none} }
  @media (max-width:560px){ header{padding:10px 12px;gap:8px} header h1{display:none} .seg button{padding:6px 11px} .ibrow{flex-direction:column} .ibrow button{padding:10px} .app{padding:10px} .ibboard{grid-template-columns:1fr} .ibzones{grid-template-columns:1fr} }
</style>
</head>
<body>
<header>
  <h1>Weekplanner</h1>
  <div class="seg" id="viewSeg">
    <button type="button" data-view="tasks">Taken</button>
    <button type="button" data-view="goals">Doelen</button>
    <button type="button" data-view="inbox">Inbox<span class="nbadge" id="ibBadge"></span></button>
  </div>
  <div class="hr">
    <button id="btnManage">Beheer</button>
  </div>
</header>

<div class="app">
  <aside class="side" id="sidebar">
    <div class="sbtop">
      <h2>Taken</h2>
      <div class="sbbtns">
        <button class="primary" id="btnNewTask">+ Nieuwe taak</button>
        <button type="button" id="btnHideSide" title="Takenlijst verbergen" aria-label="Takenlijst verbergen"><svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="3" width="14" height="12" rx="2"/><path d="M7 3v12"/></svg></button>
      </div>
    </div>

    <div class="fbar">
      <input type="search" id="fq" placeholder="Zoek in taken" autocomplete="off">
      <div class="frow">
        <div class="fgroup"><span class="fl">Groeperen op</span>
          <div class="seg" id="groupSeg"><button type="button" data-group="none">Niets</button><button type="button" data-group="goal">Doel</button><button type="button" data-group="client">Klant</button></div></div>
        <button id="btnFilter">Filter</button>
      </div>
      <div class="fpanel" id="fpanel" hidden>
        <div class="f"><span class="fl">Wie</span><div id="fWho"></div></div>
        <div class="f"><span class="fl">Doel</span><div id="fGoal"></div></div>
        <div class="f"><span class="fl">Klant</span><div id="fClient"></div></div>
        <div class="fclear"><button type="button" id="fClear">Wis filters</button></div>
      </div>
    </div>

    <div id="tasks"></div>
  </aside>

  <main class="week" id="weekView">
    <div class="calbar">
      <button type="button" id="btnShowSide" title="Takenlijst tonen" hidden><svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="3" width="14" height="12" rx="2"/><path d="M7 3v12"/></svg><span>Taken</span></button>
      <div class="nav">
        <button type="button" id="calPrev" title="Vorige">‹</button>
        <button type="button" id="calToday">Vandaag</button>
        <button type="button" id="calNext" title="Volgende">›</button>
      </div>
      <div class="callabel">
        <button type="button" id="calOpen" class="calbtn" title="Ga naar een datum"><span id="calTitle"></span><svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><rect x="2" y="3" width="12" height="11" rx="2" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M2 6.5h12M5.5 1.5v3M10.5 1.5v3" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg></button>
        <span id="calSub"></span>
        <input type="date" id="calPick" class="vh" tabindex="-1" aria-hidden="true">
      </div>
      <button type="button" id="lfToggle" aria-expanded="false" aria-controls="lFilter">Filter<span class="fcount" hidden></span></button>
      <button type="button" id="vwToggle" aria-expanded="false" aria-controls="modeSeg">Weergave</button>
      <div class="lfilter" id="lFilter">
        <div class="f"><span class="fl">Zoek</span><input type="search" id="lfQ" placeholder="Zoek in taken" aria-label="Zoek in taken"></div>
        <div class="f"><span class="fl">Wie</span><div id="lfWho"></div></div>
        <div class="f"><span class="fl">Doel</span><div id="lfGoal"></div></div>
        <div class="f"><span class="fl">Klant</span><div id="lfClient"></div></div>
        <button type="button" id="lfClear">Wis filters</button>
        
      </div>
      <div class="seg" id="modeSeg">
        <button type="button" data-mode="day">Dag</button>
        <button type="button" data-mode="workweek">Werkweek</button>
        <button type="button" data-mode="week">Week</button>
        <button type="button" data-mode="cycle" id="modeCycle" hidden>Werkperiode</button>
        <button type="button" data-mode="list">Lijst</button>
      </div>
    </div>
    <div class="rothint" id="rotHint">Draai je gsm voor deze weergave</div>
    <div class="head" id="head"></div>
    <div class="cycles" id="cycleLane"></div>
    <div class="body" id="body"></div>
    <div class="cyview" id="cycleView"></div>
    <div class="listview" id="listView"></div>
  </main>

  <main class="inboxview" id="inboxView" hidden>
    <div class="gtoolbar">
      <h2>Inbox</h2>
      <div class="seg" id="ibTabs">
        <button type="button" data-ibtab="add">Toevoegen</button>
        <button type="button" data-ibtab="sort">Verwerken<span class="nbadge" id="ibTabBadge"></span></button>
      </div>
    </div>
    <section id="ibAdd">
      <form class="ibform" id="ibForm" autocomplete="off">
        <label class="f"><span class="fl">Taak</span><input type="text" id="ibIn" placeholder="Wat moet er nog gebeuren?" enterkeyhint="done" aria-label="Nieuwe taak in de inbox"></label>
        <div class="iboptlbl"></div>
        <div class="ibextra">
          <label class="f full"><span class="fl">Notitie (optioneel)</span><textarea id="ibDesc" rows="2"></textarea></label>
          <label class="f"><span class="fl">Doel (optioneel)</span><select id="ibGoal"></select></label>
          <label class="f"><span class="fl">Deadline (optioneel)</span><input type="date" id="ibDeadline"></label>
          <div class="f full"><span class="fl">Wie (optioneel)</span><div class="wrow" id="ibWho"></div></div>
        </div>
        <div class="ibsubmit"><span class="ibmore" aria-hidden="true">Meer velden hieronder ↓</span><button class="primary" type="submit">Toevoegen</button></div>
      </form>
      <div class="ibrecent" id="ibRecent"></div>
    </section>
    <section id="ibSort" hidden>
      <div class="ibtop">
        <button type="button" id="ibUndoBtn" title="Laatste actie ongedaan maken (Ctrl+Z)">Ongedaan maken</button>
      </div>
      <div class="ibboard" id="ibBoard"></div>
    </section>
  </main>

  <main class="goalsview" id="goalsView" hidden>
    <div class="gtoolbar">
      <h2>Doelen</h2>
      <label><input type="checkbox" id="gShowAch"> Toon behaalde</label>
      <button class="primary" id="btnGoalNew">+ Nieuw doel</button>
    </div>
    <div id="goalsList"></div>
  </main>
</div>

<div id="pop" hidden></div>


<dialog id="taskDlg">
  <form id="taskForm">
    <h3 id="taskDlgTitle">Nieuwe taak</h3>
    <label class="f"><span class="fl">Taak</span><input type="text" id="newTask" autocomplete="off" placeholder="Wat moet er gebeuren?"></label>
    <label class="f"><span class="fl">Notitie (optioneel)</span><textarea id="newDesc"></textarea></label>
    <label class="f"><span class="fl" id="newTaskGoalLbl">Doel</span><select id="newTaskGoal"></select></label>
    <label class="f"><span class="fl">Deadline (optioneel)</span><input type="date" id="newDeadline"></label>
    <div class="rephint" id="repHint" hidden></div>
    <div class="f"><span class="fl">Wie (optioneel, één, beide of niemand)</span>
      <div class="wrow" id="dlgWho"></div></div>
    <label class="f" id="newListRow"><span class="fl">Zet in</span><select id="newList">
      <option value="open">Nog niet ingepland</option><option value="backlog">Backlog</option></select></label>
    <div class="btns"><button type="button" id="taskDelete" class="danger" hidden>Verwijder taak</button><button type="button" id="taskCancel">Annuleren</button><button type="submit" class="primary" id="taskSubmit">Toevoegen</button></div>
  </form>
</dialog>

<div id="toast" role="status" hidden></div>

<dialog id="goalDlg">
  <form id="goalForm">
    <h3 id="goalDlgTitle">Nieuw doel</h3>

/* ============================================================================
   TOEKOMSTIGE UITBREIDING (niet gebouwd): individuele werkblokken
   Dit staat hier als ontwerprichting, zodat wie de code later uitbreidt weet waar de haakjes zitten.

   Uitgangspunt: een agency van enkele mensen, geen groot team. Geen rechten of rollen, iedereen mag alles wijzigen.

   LAGEN (in beide werkwijzen)
   Nog in te plannen (wat kan gebeuren, voor iedereen gelijk) > werkperiode (zonder dag of uur) > werkblok (met dag en uur).
   Een taak staat in de werkperiode of in een blok, naargelang je een uur nodig hebt. Afvinken kan op beide plekken.
   De werkperiode is in beide werkwijzen optioneel (de functie kan uit).

   TWEE WERKWIJZEN (keuze in Beheer, bij Werkblokken, net als werkperiode en deadline-herinnering)
   1. Gezamenlijke werkblokken (zoals nu).
      Uitleg (voorstel): "Het team gebruikt één set werkblokken. Iedereen ziet alle taken van het team in dezelfde blokken."
      Overal zie je de taken van iedereen, tenzij je zelf filtert op Wie. Wie bij een taak staat, zet je zelf.
   2. Individuele werkblokken.
      Uitleg (voorstel): "Iedereen heeft zijn eigen werkblokken en ziet daarin enkel zijn eigen taken. In de werkperiode zie je nog altijd
      alle taken van het team. Een taak die je in je blok plant, is van jou."
      Elke gebruiker stelt zijn eigen blokken in. Een taak in je blok plannen zet je naam erop: je neemt ze over, ook als er iemand anders
      (of meerdere mensen) bij stond. Inplannen gebeurt altijd in je eigen blokken, je sleept nooit iets in het blok van een ander.
   Het onderscheid zit in van wie een werkblok is (het team of één persoon). Daaruit volgt wat je ziet en wanneer de naam op een taak komt.
   (Bewust gekozen namen: 'week' is al een weergave en 'toewijzen of oppikken' onderscheidt niet, want oppikken kan in beide werkwijzen.)

   OPEN KEUZE BIJ INDIVIDUELE WERKBLOKKEN: is de werkperiode van het team of van jezelf?
   A. Gedeelde werkperiode
      - Toont alle taken van het team, met naam. Wie wil, filtert op zichzelf.
      - Het team kiest wat er in de periode staat. Een taak erin zetten laat de naam zoals hij was (ook leeg).
      - De naam komt op de taak wanneer iemand ze in een blok plant, of wanneer iemand hem zelf zet.
      - Een taak zonder naam in de periode is nog niet opgepakt en dat zie je meteen.
   B. Persoonlijke werkperiode
      - Toont enkel je eigen taken. Wat je erin zet, haal je uit Nog in te plannen en wordt meteen de jouwe.
      - Taken van niemand blijven in Nog in te plannen tot iemand ze oppikt (in de periode of in een blok).
      - Er is geen gedeelde laag 'wat het team deze periode kiest'. Het team deelt enkel Nog in te plannen.
      - Taken van anderen in hun werkperiode zie je enkel in de teamweergave, die dus ook de werkperiode per persoon toont.
   Verschil: de werkperiode is van het team (A) of van jezelf (B), en daarmee komt de naam bij het plannen in een blok (A) of al bij het plannen in de periode (B).

   DATAMODEL: één haakje
   - Een werkblok krijgt een optioneel veld 'owner' (gebruikersid). Leeg betekent: blok van het hele team. Dat is vandaag altijd zo, dus bestaande
     data blijft geldig. De planningssleutel '<datum>|<blokId>' verandert niet, een blok-id is al uniek.
   - Een taak houdt één lijst 'who'. Bij het oppikken wordt die vervangen door de gebruiker die ze inplant. Wie bij het aanmaken ingevuld is,
     geldt als suggestie tot iemand de taak oppikt. Geen extra status en geen aparte regels-entiteit.
   - Nieuwe gebruiker in de individuele werkwijze: start met een kopie van de blokken van een bestaande gebruiker.
   - Werkperiode en eerste dag van de week blijven voor het hele team gelijk (anders lopen kolommen en periodes door elkaar).

   WISSELEN TUSSEN DE WERKWIJZEN
   Eén regel voor beide richtingen: alle ingeplande taken gaan terug naar 'Nog in te plannen', met een bevestiging die zegt hoeveel
   (zelfde vorm als bij het verwijderen van een blok of gebruiker). Namen, werkperiode en afgevinkte taken blijven staan.
   Naar individueel: iedereen krijgt een kopie van de teamblokken. Naar gezamenlijk: de eigen blokken vallen samen tot één set.

   WEERGAVE IN DE INDIVIDUELE WERKWIJZE
   - Blokken van verschillende mensen worden nooit over elkaar gelegd, ook omdat de uren vaak gelijk zijn.
   - Nieuw scherm 'Team' (alleen lezen): per dag alle taken van iedereen, met naam, onafhankelijk van het blok. Afgevinkte taken blijven staan
     (doorgestreept), zodat het ook de voortgang toont. Bovenaan komen de taken in de werkperiode die nog niet in een blok staan, met naam.
     Het kan niet de bestaande Lijst zijn: die toont enkel taken die nog niet af zijn (renderListView, !k.done).
   - Een taak met een naderende deadline zonder naam kleurt al (dueSoon). Het team wijst zelf een verantwoordelijke aan, dat hoeft niet afgedwongen.

   BEWUSTE BEPERKING
   Een taak heeft één naam. Twee mensen die tegelijk aan één taak werken, maken er twee taken van ('Mockup, deel An' en 'Mockup, deel Vincent').

   De 'Ik ben'-keuze die een prototype zonder aanmelding nodig heeft, valt dan weg.
============================================================================ */

// kleur volgt het doel; een taak zonder doel is neutraal grijs

const GOAL_HUES = [8, 32, 55, 185, 208, 325];

  const g = S.goals && S.goals.find(x=>x.id===gid), raw = g && g.hue != null ? g.hue : GOAL_HUES[gid % GOAL_HUES.length];

  return GOAL_HUES.slice().sort((a,b)=>d(a,raw)-d(b,raw))[0];   // een bewaarde tint buiten de toegelaten kleuren schuift naar de dichtstbijzijnde
};

function parseKey(k){

// werkperiode: periodes van vaste lengte die op elkaar aansluiten. Een wijziging is een nieuw stuk dat vanaf een toekomstige datum geldt, het verleden blijft zoals het was.
const fmtSp = ds => `${wdOf(ds)} ${dnum(ds)} ${mshort(ds)}`;

function addMonths(ds, n){   // zelfde dag in een andere maand; een korte maand houdt de laatste dag
  const d = parseD(ds), t = d.getUTCFullYear()*12 + d.getUTCMonth() + n, y = Math.floor(t/12), m = t - y*12;
  return toDs(new Date(Date.UTC(y, m, Math.min(d.getUTCDate(), new Date(Date.UTC(y, m+1, 0)).getUTCDate()))));
}
function periodIn(ds, c){   // de periode waar een datum in valt volgens de instelling, ook als die uit staat: {start, end, key}
  if(!c) return;
  for(let i=0;i<c.segs.length;i++){
    const sg = c.segs[i], nf = i+1 < c.segs.length ? c.segs[i+1].from : null;
    if(ds < sg.from) return;   // vóór de eerste werkperiode
    if(nf && ds >= nf) continue;
    let st, nx;   // begin van deze periode en begin van de volgende
    if(sg.unit === 'm'){
      const d = parseD(ds), f = parseD(sg.from);
      let k = Math.max(0, Math.floor(((d.getUTCFullYear()-f.getUTCFullYear())*12 + d.getUTCMonth()-f.getUTCMonth())/sg.len));
      while(k > 0 && addMonths(sg.from, k*sg.len) > ds) k--;
      while(addMonths(sg.from, (k+1)*sg.len) <= ds) k++;
      st = addMonths(sg.from, k*sg.len); nx = addMonths(sg.from, (k+1)*sg.len);
    } else {
      const k = Math.floor(daysBetween(sg.from, ds)/sg.len);
      st = addDays(sg.from, k*sg.len); nx = addDays(st, sg.len);
    }
    const nat = addDays(nx,-1); let en = nat; if(nf && en >= nf) en = addDays(nf,-1);   // een nieuw stuk begint: de lopende periode eindigt daar
    const w = en === nat ? (sg.unit === 'm' ? sg.len*30 : sg.len) : daysBetween(st,en)+1;   // gewicht voor de breedte: een volledige periode telt als de ingestelde lengte (een maand is een maand, ook als ze 28 of 31 dagen heeft)
    return {start:st, end:en, key:'cy@'+st, w};
  }
}
const cycleOn = () => !!S.cycle && S.cycle.active !== false;   // ingesteld én actief

function cycleOfTask(id){

  return Object.keys(S.plan).filter(key=>key.startsWith('cy@') && (S.plan[key]||[]).includes(id)).map(key=>periodAt(key.slice(3))).filter((pr,i,a)=>pr && pr.key === 'cy@'+pr.start).sort((a,b)=>a.start<b.start?-1:1);

const leaveCycles = id => { for(const key of Object.keys(S.plan)) if(key.startsWith('cy@')) S.plan[key] = S.plan[key].filter(x=>x!==id); };
function cleanCyclePlan(){   // taken in een periode die niet meer bestaat gaan terug naar de lijst
  for(const key of Object.keys(S.plan)){ if(!key.startsWith('cy@')) continue; const pr = periodIn(key.slice(3), S.cycle); if(!pr || pr.key !== key) delete S.plan[key]; }
}
// in de werkweek-weergave zijn zaterdag en zondag verborgen: dan tellen ze niet mee in wat je ziet (de periode zelf blijft gewoon duren)
const hiddenWd = () => S.cal.mode === 'workweek' ? ['za','zo'] : [];
function spanText(o){
  const hw = hiddenWd(); let a = o.start, z = o.end;
  while(a <= z && hw.includes(wdOf(a))) a = addDays(a,1);
  while(z >= a && hw.includes(wdOf(z))) z = addDays(z,-1);
  if(a > z){ a = o.start; z = o.end; }
  return `${fmtSp(a)} tot ${fmtSp(z)}`;
}
const moreVisible = (o, days, back) => {   // loopt de periode door op een dag die in deze weergave niet verborgen is?
  const hw = hiddenWd();
  for(let ds = back ? addDays(days[0],-1) : addDays(days[days.length-1],1); back ? ds >= o.start : ds <= o.end; ds = addDays(ds, back ? -1 : 1)) if(!hw.includes(wdOf(ds))) return true;
  return false;
};
const CYCLES_SHOWN = 4;   // zoveel werkperioden naast elkaar in de werkperiodeweergave
function cycleWindow(){   // de werkperiode waar de kalenderdatum in valt en de eerstvolgende
  const out = []; let pr = periodAt(S.cal.date);
  while(pr && out.length < CYCLES_SHOWN){ out.push(pr); pr = periodAt(addDays(pr.end,1)); }
  return out;
}
const cycleNextStart = () => { const pr = periodIn(TODAY, S.cycle); return pr ? addDays(pr.end,1) : S.cycle.segs[0].from; };   // de eerstvolgende werkperiode die nog niet begonnen is
const cycleLast = () => S.cycle.segs[S.cycle.segs.length-1];

// in welke lijst staat een taak (afgevinkt wint altijd, waar ze ook stond)
function listOf(k){
  if(k.done) return 'done';
  if(blocksOfTask(k.id).length || cycleOfTask(k.id)) return 'planned';   // één werkperiode is genoeg
  return k.status === 'backlog' ? 'backlog' : 'open';
}

// deadlines: taak.deadline is een datum of ontbreekt. Binnen de herinneringstermijn komt een taak bovenaan Nog in te plannen (een taak in de backlog gaat vanzelf mee).
const dueSoon = k => !!k.deadline && !k.done && TODAY >= addDays(k.deadline, -S.deadlineDays);
const isLate = k => !!k.deadline && !k.done && (blocksOfTask(k.id).some(b=>b.date > k.deadline) || cyclesOfTask(k.id).some(o=>o.end > k.deadline));   // ingepland na de deadline: mag, maar valt op
const fmtDl = ds => `${cap(wdOf(ds))} ${dnum(ds)} ${mshort(ds)}`;
function deadlineSweep(){
  const moved = S.tasks.filter(k=>!k.done && k.status === 'backlog' && !blocksOfTask(k.id).length && !cycleOfTask(k.id) && dueSoon(k));
  moved.forEach(k=>{ k.status = 'open'; });
  if(moved.length) toast(moved.length === 1 ? `\u201c${moved[0].title}\u201d staat nu in Nog in te plannen: de deadline komt eraan` : `${moved.length} taken staan nu in Nog in te plannen: de deadline komt eraan`);
}
function removeFromAllBlocks(id){ for(const b in S.plan) S.plan[b] = S.plan[b].filter(x=>x!==id); }

function setList(id, list){
  const k = taskOf(id); if(!k) return;
  if(list === 'backlog'){ k.done = false; k.status = 'backlog'; removeFromAllBlocks(id); }
  if(list === 'open'){    k.done = false; k.status = 'open';    removeFromAllBlocks(id); }
  if(list === 'done'){    k.done = true; }
  S.flash = list;
}

// filters op de takenlijst
function passes(k){
  const f = S.filter;
  if(f.q){ const q = f.q.toLowerCase();
    if(!(k.title.toLowerCase().includes(q) || (k.desc||'').toLowerCase().includes(q))) return false; }
  if(f.who.length && !f.who.some(v=> v === 'none' ? !k.who.length : k.who.includes(v))) return false;
  if(f.goal.length && !f.goal.some(v=> v === 'none' ? k.goal == null : k.goal === +v)) return false;
  if(f.client.length){
    const g = k.goal != null ? S.goals.find(x=>x.id===k.goal) : null;
    if(!f.client.some(v=> v === 'intern' ? !!(g && g.client == null) : !!(g && g.client === +v))) return false;
  }
  return true;
}
const filterCount = () => (S.filter.q ? 1 : 0) + ['who','goal','client'].filter(k=>S.filter[k].length).length;   // het aantal actieve filters, niet het aantal gekozen waarden
const itemsOf = key => {
  const r = S.tasks.filter(k=>listOf(k)===key && passes(k));
  if(key === 'open') r.sort((a,b)=> (+dueSoon(b))-(+dueSoon(a)) || (dueSoon(a) ? (a.deadline<b.deadline?-1 : a.deadline>b.deadline?1 : 0) : 0));   // taken met een naderende deadline bovenaan
  return r;
};
// standaard staat enkel Nog niet ingepland open; is die leeg, dan enkel Ingepland. Een handmatige keuze (fold) wint.
// Zonder handmatige keuze volgt de indeling de inhoud: er zijn ongeplande taken, dan enkel die lijst open; anders enkel Ingepland.
const defaultOpenKey = () => itemsOf('open').length ? 'open' : itemsOf('planned').length ? 'planned' : null;
// Is er een zoekterm of filter actief, dan staan alle lijsten met resultaten open en de lege dicht.
const defaultSig = () => filterCount() ? 'f' + LISTS.map(([k])=>itemsOf(k).length ? 1 : 0).join('') : String(defaultOpenKey());
const defaultClosed = key => filterCount() ? !itemsOf(key).length : key !== defaultOpenKey();
const isClosed = key => S.fold[key] !== undefined ? S.fold[key] : defaultClosed(key);

// doel en klant (de klant volgt uit het doel); aanpassen kan enkel via het potlood
function metaLine(id){
  const g = goalOf(id), c = clientOf(id);
  const goalRow = g ? `<div class="mrow goal"><span class="k">Doel</span><span class="v">${esc(g.name)}</span></div>` : '';
  const clientRow = c ? `<div class="mrow client"><span class="k">Klant</span><span class="v">${esc(c.name)}</span></div>` : '';
  const k = taskOf(id);
  const dlRow = k && k.deadline ? `<div class="mrow deadline ${isLate(k)?'late':dueSoon(k)?'due':''}"><span class="k">Deadline</span><span class="v">${fmtDl(k.deadline)}${k.repeat ? ` <span class="dkrep">${REP_ICON} ${repText(k.repeat)}</span>` : ''}${isLate(k) ? ' · te laat ingepland' : ''}</span></div>` : '';
  const out = goalRow + clientRow + dlRow;
  return out ? `<div class="meta">${out}</div>` : '';
}

function taskCard(k, extra, noPen, noPlan){
  const bl = blocksOfTask(k.id), cyc = cyclesOfTask(k.id);
  const desc = k.desc ? `<div class="desc">${esc(k.desc)}</div>` : '';
  const who = k.who.map(avatar).join('');
  return `<div class="task ${k.done?'done':''} ${isLate(k)?'late':''}" draggable="true" data-src="new" data-task="${k.id}" style="${style(k.id)}">
    <input type="checkbox" class="chk" data-check="${k.id}" ${k.done?'checked':''} title="Afvinken">
    <div class="body"><div class="trow"><div class="title">${esc(k.title)}</div><div class="who">${who}</div></div>
    ${desc}${metaLine(k.id)}
    ${noPlan || !(bl.length || cyc.length) ? '' : `<div class="meta"><div class="mrow plan"><span class="k">Plan</span><span class="v links">${cyc.map(o=>
      `<button type="button" class="gl" data-goblock="${o.key}" data-gotask="${k.id}" title="Ga naar deze werkperiode in de kalender">Werkperiode · ${spanText(o)}</button>`).join('')}${bl.map(b=>
      `<button type="button" class="gl" data-goblock="${b.id}" data-gotask="${k.id}" title="Ga naar deze dag in de kalender">${cap(wdOf(b.date))} ${dnum(b.date)} ${mshort(b.date)} · ${fmt(b.s)} tot ${fmt(b.e)}</button>`).join('')}</span></div></div>`}</div>
    <div class="acts">${noPen ? '' : `<button title="Taak bewerken" data-edit="${k.id}">✎</button>`}${extra || ''}</div></div>`;
}

function renderItems(items){
  if(!items.length) return '<div class="none-msg">Niets in deze lijst.</div>';
  const mode = S.groupBy;
  if(mode === 'none') return `<div class="list-tasks">${items.map(k=>taskCard(k)).join('')}</div>`;
  const goalById = id => id != null ? S.goals.find(x=>x.id===id) : null;
  let groups;
  if(mode === 'goal'){
    groups = S.goals.map(g=>({head:`<span class="gname">${esc(g.name)}</span>${g.achieved?'<span class="gc">behaald</span>':''}${pill(S.clients.find(c=>c.id===g.client))}`,
      tasks:items.filter(k=>k.goal===g.id)}));
    groups.push({head:'<span class="gname">Zonder doel</span>', tasks:items.filter(k=>!goalById(k.goal))});
  } else {
    groups = S.clients.map(c=>({head:`<span class="gname">${esc(c.name)}</span>`,
      tasks:items.filter(k=>{const g=goalById(k.goal);return g&&g.client===c.id;})}));
    groups.push({head:'<span class="gname">Intern</span>',
      tasks:items.filter(k=>{const g=goalById(k.goal);return g&&g.client==null;})});
    groups.push({head:'<span class="gname">Zonder doel</span>', tasks:items.filter(k=>!goalById(k.goal))});
  }
  return groups.filter(g=>g.tasks.length).map(g=>{
    const used = new Set(); g.tasks.forEach(k=>blocksOfTask(k.id).forEach(b=>used.add(b.id)));
    return `<div class="group"><div class="gh">${g.head}<span class="gn">${used.size} ${used.size===1?'blok':'blokken'}</span></div>
      <div class="list-tasks">${g.tasks.map(k=>taskCard(k)).join('')}</div></div>`;
  }).join('');
}

function renderSidebar(){
  // filterbediening (het zoekveld zelf blijft ongemoeid zodat je kan blijven typen)
  const f = S.filter;
  const fq = document.getElementById('fq'); if(document.activeElement !== fq) fq.value = S.filter.q;
  msRender('fWho','who','side'); msRender('fGoal','goal','side'); msRender('fClient','client','side');
  document.getElementById('fpanel').hidden = !S.showFilters;
  const fc = filterCount(), fb = document.getElementById('btnFilter');
  fb.innerHTML = fc ? `Filter<span class="fcount">${fc}</span>` : 'Filter';
  fb.classList.toggle('active', fc>0);
  document.getElementById('fClear').disabled = fc === 0;
  document.querySelectorAll('#groupSeg button').forEach(b=>b.classList.toggle('active', b.dataset.group === S.groupBy));

  // lijsten onder elkaar. Verandert de situatie (welke lijst standaard openstaat), dan vervallen handmatige keuzes en volgt alles weer de standaard.
  S.flash = null;
  const dk = defaultSig(); if(S.foldDk !== undefined && S.foldDk !== dk) S.fold = {}; S.foldDk = dk;
  const box = document.getElementById('tasks');
  box.innerHTML = LISTS.map(([key,label])=>{
    const items = itemsOf(key), closed = isClosed(key);
    return `<div class="sec ${closed?'closed':''}" data-list="${key}">
      <div class="sh" data-fold="${key}"><span class="chev">▸</span><span class="sl">${label}</span><span class="cnt">${items.length}</span></div>
      ${closed ? '' : `<div class="sb">${items.length ? renderItems(items) : `<div class="none-msg">${key==='open' ? 'Alles is ingepland of staat in een andere lijst.' : 'Niets in deze lijst.'}</div>`}</div>`}</div>`;
  }).join('');

  reapplyHover();
}

function calDays(){
  const c = S.cal;
  if(c.mode === 'day') return [c.date];
  const first = addDays(c.date, -((parseD(c.date).getUTCDay() - S.weekStart + 7) % 7));
  const week = Array.from({length:7}, (_,i)=>addDays(first,i));
  return c.mode === 'week' ? week : week.filter(ds=>!['za','zo'].includes(wdOf(ds)));   // werkweek: de werkdagen van die week, in de volgorde van je weekstart
}
const PHONE = () => matchMedia('(max-width:700px)').matches;
const yrTxt = d => d.slice(0,4) === TODAY.slice(0,4) ? '' : ' ' + d.slice(0,4);   // op de gsm geen jaartal voor dit jaar
function renderCalBar(){
  const c = S.cal, days = calDays(), a = days[0], z = days[days.length-1];
  const cur = days.includes(TODAY);
  const yr = parseD(z).getUTCFullYear();
  let title, sub = '';
  const cyc = c.mode === 'cycle' ? periodAt(c.date) : null;
  document.getElementById('calPrev').disabled = !!cyc && !periodAt(addDays(cyc.start,-1));
  if(!cyc) document.getElementById('calPrev').disabled = false;
  if(cyc){
    const win = cycleWindow(), f = win[0], l = win[win.length-1], y = d => d.slice(0,4);
    title = `${dnum(f.start)} ${mname(f.start)}${y(f.start)!==y(l.end) ? ' '+y(f.start) : ''} tot ${dnum(l.end)} ${mname(l.end)} ${y(l.end)}`;
  } else if(c.mode === 'day'){
    title = PHONE() ? `${cap(wdOf(a))} ${dnum(a)} ${mshort(a)}${yrTxt(a)}` : `${WDLONG[wdOf(a)]} ${dnum(a)} ${mname(a)} ${yr}`;
  } else if(PHONE()){
    title = mshort(a)===mshort(z) ? `${dnum(a)} tot ${dnum(z)} ${mshort(z)}${yrTxt(z)}` : `${dnum(a)} ${mshort(a)} tot ${dnum(z)} ${mshort(z)}${yrTxt(z)}`;
  } else {
    title = mname(a)===mname(z) ? `${dnum(a)} tot ${dnum(z)} ${mname(z)} ${yr}` : `${dnum(a)} ${mname(a)} tot ${dnum(z)} ${mname(z)} ${yr}`;
  }
  // Vandaag is ingedrukt en niet klikbaar zodra je er al bent (de dag, de week of de werkperiode van vandaag)
  const onToday = cyc ? (TODAY >= cyc.start && TODAY <= cyc.end) : days.includes(TODAY);
  document.getElementById('calToday').disabled = onToday;
  if(filterCount()) sub += (sub ? ' · ' : '') + 'filter actief';
  document.getElementById('calTitle').textContent = title;
  document.getElementById('calSub').textContent = sub;
  document.getElementById('calPick').value = c.date;
  document.querySelectorAll('[data-mode]').forEach(b=>b.classList.toggle('active', b.dataset.mode===c.mode));
}

function cyPart(id, key){   // staat de taak in meer werkperioden, dan telt het zoals bij werkblokken: 1/2, 2/2
  const cs = cyclesOfTask(id); return cs.length > 1 ? `<span class="p">${cs.findIndex(o=>o.key===key)+1}/${cs.length}</span>` : '';
}
function renderCycles(days, cols){
  const lane = document.getElementById('cycleLane'); lane.style.gridTemplateColumns = cols;
  const groups = [];   // de zichtbare dagen per periode
  days.forEach((ds,i)=>{ const o = periodAt(ds); if(!o) return; const g = groups[groups.length-1]; if(g && g.o.key===o.key) g.z = i; else groups.push({o,a:i,z:i}); });
  lane.innerHTML = groups.map(g=>{
    const o = g.o, ids = S.plan[o.key] || [];
    const chips = ids.map(id=>{
      const k = taskOf(id); if(!k) return '';
      return `<div class="chip ${k.done?'done':''} ${isLate(k)?'late':''} ${filterCount() && !passes(k) ? 'dim' : ''}" draggable="true" data-task="${id}" data-src="${o.key}" style="${style(id)}">
        <div class="ct"><input type="checkbox" class="chk" data-check="${id}" ${k.done?'checked':''} title="Afvinken"><span class="t">${esc(k.title)}</span><span class="cside">${k.who.map(avatar).join('')}${cyPart(id, o.key)}<button class="x" data-rm="${o.key}:${id}" title="Haal uit werkperiode">\u00d7</button></span></div>
        ${metaLine(id)}</div>`;
    }).join('');
    return `<div class="cycle ${days[g.a]>o.start && moreVisible(o, days.slice(g.a), true)?'cl':''} ${days[g.z]<o.end && moreVisible(o, days.slice(0,g.z+1), false)?'cr':''}" data-block="${o.key}" style="grid-column:${g.a+2} / ${g.z+3};grid-row:1">
      <div class="cyh"><b>${spanText(o)}</b></div>
      <div class="list">${chips || '<div class="empty">Sleep hier taken naartoe</div>'}</div></div>`;
  }).join('');
}
// lijstweergave: de ingeplande taken op volgorde van de tijd (per werkperiode eerst de vaste dagen, dan wat in de werkperiode zelf staat), daarna de backlog. De volgorde binnen een blok, een werkperiode en de backlog is je eigen volgorde.
function renderListFilter(){   // dezelfde filters als in de zijbalk, ze delen S.filter
  msRender('lfWho','who','list'); msRender('lfGoal','goal','list'); msRender('lfClient','client','list');
  const q = document.getElementById('lfQ'); if(document.activeElement !== q) q.value = S.filter.q;
  document.getElementById('lfClear').disabled = filterCount() === 0;
  const lt = document.getElementById('lfToggle'), fc = filterCount(), cb = lt.querySelector('.fcount');
  lt.classList.toggle('active', fc > 0); cb.hidden = !fc; cb.textContent = fc;
  document.getElementById('lFilter').classList.toggle('open', !!S.lfOpen); lt.setAttribute('aria-expanded', !!S.lfOpen);
}
function renderListView(){
  renderListFilter();
  const ok = id => { const k = taskOf(id); return k && !k.done && passes(k); };
  const card = id => taskCard(taskOf(id), '', false, true);
  const ev = [];   // {pos, type, date|key}: pos is het begin van de werkperiode (of de datum zelf buiten elke werkperiode)
  const dates = [...new Set(Object.keys(S.plan).filter(k=>k.includes('|') && (S.plan[k]||[]).some(ok)).map(k=>k.split('|')[0]))];
  dates.forEach(d=>{ const o = periodAt(d); ev.push({pos:o ? o.start : d, per:o, type:0, date:d}); });
  if(cycleOn()) Object.keys(S.plan).filter(k=>k.startsWith('cy@') && (S.plan[k]||[]).some(ok)).forEach(k=>{ const o = periodAt(k.slice(3)); if(o && o.key === k) ev.push({pos:o.start, per:o, type:1, key:k}); });
  ev.sort((a,b)=> a.pos<b.pos?-1 : a.pos>b.pos?1 : a.type-b.type || (a.date||'') .localeCompare(b.date||''));
  const dayHtml = d => {
    const ids = [...new Set(blocksOn(d).flatMap(b=>S.plan[b.id]||[]))].filter(ok);   // de blokken bepalen de volgorde (op uur, dan je eigen volgorde), maar staan er niet als kop
    return `<div class="lgrp"><h4 class="${d===TODAY?'today':''}">${cap(wdOf(d))} ${dnum(d)} ${mshort(d)}${d===TODAY?'<span>vandaag</span>':''}</h4><div class="list-tasks">${ids.map(card).join('')}</div></div>`;
  };
  let html = '', i = 0;
  while(i < ev.length){
    const o = ev[i].per, grp = [], same = e => o ? !!e.per && e.per.key === o.key : !e.per;
    while(i < ev.length && same(ev[i])){ grp.push(ev[i]); i++; }
    const inner = grp.map(e=> e.type === 0 ? dayHtml(e.date) : `<div class="lgrp"><h4>In de hele werkperiode</h4><div class="list-tasks">${S.plan[e.key].filter(ok).map(card).join('')}</div></div>`).join('');
    html += o ? `<section class="lsec per"><h3>Werkperiode ${spanText(o)}${TODAY>=o.start && TODAY<=o.end ? '<small>loopt nu</small>' : ''}</h3>${inner}</section>` : `<section class="lsec">${inner}</section>`;
  }
  const bk = itemsOf('backlog');
  if(bk.length) html += `<section class="lsec"><h3>Backlog<small>${bk.length}</small></h3><div class="list-tasks">${bk.map(k=>taskCard(k)).join('')}</div></section>`;
  document.getElementById('listView').innerHTML = html || '<div class="none-msg">Niets ingepland en niets in de backlog.</div>';
}
function cyHintSync(){   // gsm: de titel toont de werkperiode die je ziet (1 van 4), want de rest staat buiten beeld
  if(!PHONE()) return;
  const cv = document.getElementById('cycleView'), win = cycleWindow(); if(!cv || !win.length) return;
  const n = win.length, i = Math.min(n - 1, cv.clientWidth ? Math.round(cv.scrollLeft / cv.clientWidth) : 0), o = win[i], y = d => d.slice(0,4);
  document.getElementById('calTitle').textContent = `${dnum(o.start)} ${mshort(o.start)}${y(o.start)!==y(o.end) ? ' '+y(o.start) : ''} tot ${dnum(o.end)} ${mshort(o.end)}${yrTxt(o.end)}`;
  document.getElementById('calSub').textContent = (n > 1 ? `${i > 0 ? '‹ ' : ''}${i + 1} van ${n}${i < n - 1 ? ' ›' : ''}` : '') + (filterCount() ? (n > 1 ? ' · ' : '') + 'filter actief' : '');
}
document.getElementById('cycleView').addEventListener('scroll', cyHintSync, {passive:true});
function renderCycleView(){
  const win = cycleWindow();
  const tpl = win.map(o=>`minmax(150px,${o.w}fr)`).join(' ');   // de breedte volgt de lengte: een lange werkperiode is een brede kolom
  const head = win.map(o=>`<div class="${TODAY>=o.start && TODAY<=o.end ? 'today' : ''}">${cap(wdOf(o.start))} ${dnum(o.start)} ${mshort(o.start)}<small>tot ${wdOf(o.end)} ${dnum(o.end)} ${mshort(o.end)}</small></div>`).join('');
  const chipHtml = (id, src, dated, per) => {   // dated: src is het eerste blok van de taak in deze periode; ze staat er één keer, met al haar momenten
    const k = taskOf(id); if(!k) return '';
    const mine = dated ? blocksOfTask(id).filter(b=>{ const o = periodIn(b.date, S.cycle); return o && o.key === per; }) : [];
    const day = mine.length ? `<div class="meta"><div class="mrow plan"><span class="k">${mine.length > 1 ? 'Dagen' : 'Dag'}</span><span class="v">${mine.map(b=>`${cap(wdOf(b.date))} ${dnum(b.date)} ${mshort(b.date)} · ${fmt(b.s)} tot ${fmt(b.e)}`).join('<br>')}</span></div></div>` : '';
    return `<div class="chip ${k.done?'done':''} ${isLate(k)?'late':''} ${filterCount() && !passes(k) ? 'dim' : ''}" draggable="true" data-task="${id}" data-src="${src}"${dated ? ` data-srcp="${per}"` : ''} style="${style(id)}">
        <div class="ct"><input type="checkbox" class="chk" data-check="${id}" ${k.done?'checked':''} title="Afvinken"><span class="t">${esc(k.title)}</span><span class="cside">${k.who.map(avatar).join('')}${dated ? '' : cyPart(id, src)}<button class="x" ${dated ? `data-rmall="${per}:${id}"` : `data-rm="${src}:${id}"`} title="${dated ? (mine.length > 1 ? 'Haal uit de blokken' : 'Haal uit blok') : 'Haal uit werkperiode'}">\u00d7</button></span></div>
        ${day}${metaLine(id)}</div>`;
  };
  const cols = win.map(o=>{
    // eerst de taken van de periode zelf (los, te ordenen), dan de taken op een werkblok (vast op hun dag, op datum en uur)
    const first = new Map();   // taak -> eerste blok in deze periode (op datum en uur)
    for(let d = o.start; d <= o.end; d = addDays(d,1)) for(const b of blocksOn(d)) for(const id of (S.plan[b.id]||[])) if(!first.has(id)) first.set(id, b.id);
    const dated = [...first].map(([id, src])=>chipHtml(id, src, true, o.key));
    const own = (S.plan[o.key] || []).map(id=>chipHtml(id, o.key, false)).join('');
    const body = (own ? `<div class="cyown">${own}</div>` : '') + (dated.length && own ? '<div class="cysep">Op vaste dagen</div>' : '') + (dated.length ? `<div class="cydated">${dated.join('')}</div>` : '');
    return `<div class="cycol ${TODAY>=o.start && TODAY<=o.end ? 'today' : ''}"><div class="cyblock" data-block="${o.key}">${body || '<div class="empty">Sleep hier taken naartoe</div>'}</div></div>`;
  }).join('');
  const cv = document.getElementById('cycleView');
  cv.innerHTML = `<div class="cyhead" style="--n:${win.length};grid-template-columns:${tpl}">${head}</div><div class="cybody" style="--n:${win.length};grid-template-columns:${tpl}">${cols}</div>`;
  cyHintSync();
}
